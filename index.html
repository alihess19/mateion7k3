  sv.forEach((s) => { if (s.resteAFacturer <= 0) return; const l = c.lignes.find((x) => x.ligneId === s.ligneId); const dejaLivreNonFacture = Math.max(0, Math.min(s.resteAFacturer, s.livree - s.facturee));
    if (dejaLivreNonFacture > 0) lignes.push({ ...l, qte: dejaLivreNonFacture, direct: false }); if (s.resteAFacturer - dejaLivreNonFacture > 0) lignes.push({ ...l, qte: s.resteAFacturer - dejaLivreNonFacture, direct: true }); });
  const bl = S.pieces.filter((x) => x.type === "livraison" && x.commandeId === id && x.statut !== "annule").pop();

}

async function saveAvoir(fid) {
  const f = byId("pieces", fid); const L = lignesFacture(fid); if (!v("av_m").trim()) { toast("Indique le motif"); return; }
  const R = L.map((x, i) => ({ x, q: num(v("av_q" + i)), etat: v("av_e" + i), max: num(($("#av_q" + i) || {}).dataset ? $("#av_q" + i).dataset.max : 0) })).filter((r) => r.q > 0);
  if (R.some((r) => r.q > r.max + 1e-9)) { toast("Retour supérieur à la quantité facturée restante"); return; }
  const geste = num(v("av_g")); const netAvant = etatFacture(f).net;
  const montantRetours = sum(R, (r) => (num(r.x.total) / num(r.x.qte)) * r.q);
  if (!R.length && geste <= 0) { toast("Indique un retour ou un geste commercial"); return; }
  if (geste > netAvant - montantRetours + 0.5) { toast("Le geste commercial dépasse le montant restant de la facture"); return; }
  const numero = nextNum("pieces", "AV"); const montant = Math.round(montantRetours + geste);
  await guard(async () => {
    const aid = await put("pieces", null, { type: "avoir", num: numero, clientId: f.clientId, date: today(), canal: f.canal, factureId: fid, origineId: fid, montant, geste, motif: v("av_m"), retours: R.map((r) => ({ venteId: r.x.id, produitId: r.x.produitId, qte: r.q, etat: r.etat })), statut: "valide", lignes: [] }, `Avoir ${numero} sur ${f.num} · ${F(montant)}`);
    for (const r of R) { const x = byId("ventes", r.x.id);
      await put("ventes", x.id, { retours: num(x.retours) + r.q, retoursPerte: num(x.retoursPerte) + (r.etat === "perte" ? r.q : 0), historique: [...(x.historique || []), { date: new Date().toISOString(), par: ME, retour: r.q, motif: "Avoir " + numero }] }, "");
      if (r.etat === "stock") { const it = finiOf(x.produitId) || stockOfProduit(x.produitId); const bl = S.pieces.find((p) => p.type === "livraison" && p.statut !== "annule" && p.commandeId && f.commandeId === p.commandeId && (p.lignes || []).some((l) => l.ligneId === x.ligneId));
        const viaBL = (f.lignes.find((l) => l.ligneId === x.ligneId && num(l.qte) === num(x.qte)) || {}).direct === false && bl;
        if (it) await addMvt({ itemId: it.id, type: "retour", qte: r.q, valeurUnitaire: x.coutUnitaire, source: "retour", ref: viaBL ? "pieces/" + bl.id : "ventes/" + x.id, motif: `Avoir ${numero} · ${f.num}` }); } }
    if (geste > 0) await put("ventes", null, { num: numero, date: today(), produitId: (L[0] || {}).produitId || "", qte: 1, pu: -geste, remise: 0, total: -geste, clientId: f.clientId, canal: f.canal, coutUnitaire: 0, statut: "validee", retours: 0, avoir: true, factureId: fid, factureNum: f.num, avoirId: aid }, "");
    if ($("#av_rb") && $("#av_rb").checked && v("av_cpt")) { const cash = paidOf("pieces/" + fid) + sum(L, (x) => paidOf("ventes/" + x.id)); const du = netAvant - montant - sum(avoirsFin(fid), (x) => Math.abs(num(x.total))); const rb = Math.min(montant, Math.max(0, cash - Math.max(0, du))); if (rb > 0.5) await addOp({ compte: v("av_cpt"), sens: "out", montant: rb, type: "remboursement", ref: "pieces/" + fid, libelle: `Remboursement avoir ${numero}` }); }
    closeM();
  }, `Avoir ${numero} émis`);
}

<script>
/* ============================================================
   MATEIÓN BUSINESS OS · Phase 7 — MATEIÓN Intelligence
   Questions en langage naturel sur les données réelles.
   1. Moteur local (sans IA) : intention + période → analyse exacte.

   Centre d'alertes transversal et synthèse automatique.

const pctI = (x) => (x === null || x === undefined || !isFinite(x) ? "—" : (x >= 0 ? "" : "−") + Math.abs(x).toFixed(1) + " %");
const varTxt = (a, b) => { const x = INTEL.variation(a, b); return x === null ? "" : ` (${x >= 0 ? "+" : "−"}${Math.abs(x).toFixed(0)} % par rapport à la période précédente)`; };
const rngI = (p) => (p ? range(p.type, p.ref) : range(PER.type, PER.ref));
const labI = (p) => (p ? p.label : perLabel(PER.type, range(PER.type, PER.ref)).toLowerCase());
const prevI = (p) => (p ? prevRange(p.type, p.ref) : prevRange(PER.type, PER.ref));
const R0 = (titre) => ({ titre, verifie: [], calculs: [], previsions: [], recommandations: [], table: null, aller: null });

/* ---------- analyses (chiffres exacts, provenance claire) ---------- */
const ANALYSES = {
  produit_rentable(p) { const r = rngI(p); const x = R0(`Produits les plus rentables · ${labI(p)}`); const L = MT.perfPar("produitId", { ventes: ventesR(r), produits: S.produits, modeles: S.modeles }).filter((z) => z.ca > 0);
    if (!L.length) { const C = S.produits.filter((q) => q.actif !== false && q.vendable !== false && num(q.prix) > 0).map((q) => ({ q, m: MT.marge(q.prix, coutRevient(q.id).v) })).filter((z) => z.m.taux !== null).sort((a, b) => b.m.taux - a.m.taux);
      x.verifie.push(`Aucune vente sur la période (${labI(p)}).`); if (C.length) { x.calculs.push({ l: "Marge unitaire théorique la plus élevée", v: `${nomProd(C[0].q.id)} : ${pctI(C[0].m.taux)} (${F(C[0].m.montant)} par unité)`, f: "(prix de vente − coût de revient) ÷ prix de vente" }); x.table = { h: ["Référence", "Prix", "Coût de revient", "Marge unitaire", "Taux"], rows: C.slice(0, 8).map((z) => [nomProd(z.q.id), F(z.q.prix), F(coutRevient(z.q.id).v), F(z.m.montant), pctI(z.m.taux)]) }; } return x; }
    const parM = [...L].sort((a, b) => b.marge - a.marge); const parT = [...L].sort((a, b) => (b.taux ?? -1e9) - (a.taux ?? -1e9));
    x.verifie.push(`${L.length} référence(s) vendue(s) ${labI(p)}, pour ${F(sum(L, (z) => z.ca))} de chiffre d'affaires.`);
    x.calculs.push({ l: "Plus forte marge en valeur", v: `${nomProd(parM[0].key)} : ${F(parM[0].marge)} (${N(parM[0].unites)} unités, taux ${pctI(parM[0].taux)})`, f: "chiffre d'affaires − coût réel des produits vendus" });
    x.calculs.push({ l: "Meilleur taux de marge", v: `${nomProd(parT[0].key)} : ${pctI(parT[0].taux)}`, f: "marge brute ÷ chiffre d'affaires" });
    const neg = L.filter((z) => z.marge < 0); if (neg.length) x.recommandations.push(`${neg.map((z) => nomProd(z.key)).join(", ")} : vendu(s) à perte sur la période. Revois le prix ou le coût de revient.`);
    const obj = P("objectifMarge", 40); const sous = L.filter((z) => z.taux !== null && z.taux >= 0 && z.taux < obj); if (sous.length) x.recommandations.push(`${sous.length} référence(s) sous l'objectif de marge de ${obj} % : ${sous.slice(0, 3).map((z) => nomProd(z.key)).join(", ")}${sous.length > 3 ? "…" : ""}.`);
    x.table = { h: ["Référence", "Unités", "Chiffre d'affaires", "Marge brute", "Taux"], rows: parM.slice(0, 10).map((z) => [nomProd(z.key), N(z.unites), F(z.ca), F(z.marge), pctI(z.taux)]) }; x.aller = { tab: "finance", sub: "rentabilite", l: "Voir la rentabilité détaillée" }; return x; },
  marque_revenus(p) { const r = rngI(p), pr = prevI(p); const x = R0(`Revenus par marque · ${labI(p)}`); const o = (rr) => MT.perfPar("marqueId", { ventes: ventesR(rr), produits: S.produits, modeles: S.modeles }); const L = o(r).filter((z) => z.ca > 0); const Lp = pr ? o(pr) : [];
    if (!L.length) { x.verifie.push(`Aucune vente sur la période (${labI(p)}).`); return x; } const tot = sum(L, (z) => z.ca); const n = (k) => (k ? nomMarque(k) : "Sans marque");
    x.verifie.push(`${n(L[0].key)} a généré ${F(L[0].ca)} de chiffre d'affaires ${labI(p)}${varTxt(L[0].ca, (Lp.find((z) => z.key === L[0].key) || {}).ca || 0)}.`);
    x.calculs.push({ l: "Part du chiffre d'affaires", v: `${n(L[0].key)} : ${pctI((L[0].ca / tot) * 100)} du total (${F(tot)})`, f: "CA de la marque ÷ CA total" }, { l: "Marge brute de la marque", v: `${F(L[0].marge)} (taux ${pctI(L[0].taux)})`, f: "CA − coût réel des produits vendus" });
    const best = [...L].sort((a, b) => (b.taux ?? -1) - (a.taux ?? -1))[0]; if (best.key !== L[0].key) x.recommandations.push(`${n(best.key)} a le meilleur taux de marge (${pctI(best.taux)}) : la développer améliorerait la rentabilité globale.`);

  a_fabriquer() { const x = R0("Produits à fabriquer prochainement"); const sug = MFG.suggestions({ produits: S.produits, recettes: S.recettes, ordres: S.ordres, stockQte: qteProduit }); const O = ofOuverts();

    if (!sug.length) x.verifie.push("Aucune référence dotée d'une recette active n'est au niveau de son seuil d'alerte.");
    sug.forEach((s) => x.calculs.push({ l: nomProd(s.produitId), v: `stock ${N(s.stock)}${s.planifie ? " + " + N(s.planifie) + " planifiés" : ""} ≤ seuil ${N(s.seuil)} → ${N(s.aFabriquer)} à fabriquer`, f: "remonter au stock maximal (ou au double du seuil)" }));
    sug.forEach((s) => { const cv = couvertureOf((stockOfProduit(s.produitId) || {}).id); if (cv.jours !== null) x.previsions.push(`${nomProd(s.produitId)} : stock épuisé dans environ ${Math.max(0, Math.floor(cv.jours))} jour(s) au rythme des 30 derniers jours (${N(cv.parJour)} par jour).`); });
    const man = MFG.besoins(O, (id) => qte(id)).filter((b) => b.manque > 0); man.forEach((b) => x.recommandations.push(`Acheter ${N(b.manque)} ${itemU(b.itemId)} de ${itemNom(b.itemId)} pour couvrir les ordres ouverts.`));
    sug.filter((s) => s.urgence === "rupture").forEach((s) => x.recommandations.push(`Planifier en priorité ${nomProd(s.produitId)} : déjà en rupture.`));
    const sansRec = S.produits.filter((q) => q.actif !== false && num(q.seuil) > 0 && stockOfProduit(q.id) && qte(stockOfProduit(q.id).id) <= num(q.seuil) && !RECS().some((rc) => rc.produitId === q.id && rc.statut === "active")); if (sansRec.length) x.recommandations.push(`${sansRec.length} référence(s) sous le seuil sans recette active (ex. ${nomProd(sansRec[0].id)}) : crée leur recette pour les planifier.`);
    x.aller = { tab: "production", sub: "plan", l: "Ouvrir la planification" }; return x; },
  depenses_evolution() { const x = R0("Évolution des dépenses (6 derniers mois)"); const t = today(); const M = [5, 4, 3, 2, 1, 0].map((k) => { const d = new Date(t + "T12:00:00"); d.setDate(1); d.setMonth(d.getMonth() - k); const r = range("mois", MT.localDate(d)); const f = fin(r); return { lab: d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" }), r, ch: f.charges, cat: f.parCategorie, en: k === 0 }; });
    M.forEach((m) => x.verifie.push(`${m.lab}${m.en ? " (en cours)" : ""} : ${F(m.ch)} de charges.`));
    const a = M[4], b = M[3]; x.calculs.push({ l: `${a.lab} vs ${b.lab}`, v: `${F(a.ch - b.ch)}${varTxt(a.ch, b.ch)}`, f: "charges du dernier mois terminé − mois précédent" });
    const cats = [...new Set([...Object.keys(a.cat), ...Object.keys(b.cat)])].map((c) => ({ c, d: num(a.cat[c]) - num(b.cat[c]) })).sort((u, w) => w.d - u.d);
    if (cats.length && cats[0].d > 0) x.calculs.push({ l: "Plus forte hausse", v: `${cats[0].c} : +${F(cats[0].d)}`, f: "par catégorie, entre les deux derniers mois terminés" });
    const tend = FIN.tendance(M.slice(0, 5).map((m) => m.ch), 1)[0]; x.previsions.push(`Tendance linéaire : environ ${F(tend)} de charges le mois prochain si le rythme se maintient (indication, pas un engagement).`);
    const B = budgetDoc(+t.slice(0, 4)); if (B) { const bud = sum(Object.keys(B.lignes || {}).filter((k) => k.startsWith("charge:")), (k) => budgetPeriode(B, k, M[5].r)); if (bud) x.recommandations.push(`Ce mois-ci : ${F(M[5].ch)} engagés pour ${F(bud)} budgétés (${pctI((M[5].ch / bud) * 100)}).`); }

  depenses_top(p) { const r = rngI(p); const x = R0(`Principales dépenses · ${labI(p)}`); const f = fin(r); const L = Object.entries(f.parCategorie).sort((a, b) => b[1] - a[1]);

/* ---------- centre d'alertes transversal ---------- */
function alertesGlobales() {
  const A = []; const t = today();
  try { alertesStock().filter((a) => a.niv >= 2).forEach((a) => A.push({ niv: a.niv, module: "Stocks", texte: `${a.i.nom} : ${a.txt}`, go: `go('stocks')` })); } catch (e) {}
  try { echeances().filter((e) => e.etat === "retard").forEach((e) => A.push({ niv: 2, module: e.sens === "in" ? "Créances" : "Dettes", texte: `${e.qui}${e.doc && e.doc !== e.qui ? " · " + e.doc : ""} : ${F(e.du)} ${e.sens === "in" ? "à recevoir" : "à payer"}, échéance dépassée (${dfr(e.ech)})`, go: e.open })); } catch (e) {}
  try { ofOuverts().filter((o) => o.datePrevue && o.datePrevue < t).forEach((o) => A.push({ niv: 2, module: "Production", texte: `${o.num} en retard (prévu le ${dfr(o.datePrevue)})`, go: `voirOF('${o.id}')` })); S.lots.filter((l) => !l.annule && l.statutQC === "en_attente").forEach((l) => A.push({ niv: 1, module: "Qualité", texte: `Lot ${l.num} en attente de contrôle qualité`, go: `voirLot('${l.id}')` })); } catch (e) {}
  try { const m3 = [1, 2, 3].map((k) => { const d = new Date(t + "T12:00:00"); d.setDate(1); d.setMonth(d.getMonth() - k); return range("mois", MT.localDate(d)); }); const E = echeances(); const P2 = FIN.previsionTresorerie({ solde: tresorerie(), entrees: E.filter((e) => e.sens === "in").map((e) => ({ date: e.ech, montant: e.du })), sorties: E.filter((e) => e.sens === "out").map((e) => ({ date: e.ech, montant: e.du })), chargesFixesMensuelles: sum(m3, (r) => fin(r).fixes) / 3, today: t, semaines: 13 });
    if (P2.premiereNegative) A.push({ niv: 3, module: "Trésorerie", texte: `Trésorerie négative prévue la semaine du ${dfr(P2.premiereNegative.debut)}`, go: `FSUB='previsions';go('finance')` }); } catch (e) {}
  try { const B = budgetDoc(+t.slice(0, 4)); if (B) { const r = range("mois", t); const f = fin(r); Object.keys(B.lignes || {}).filter((k) => k.startsWith("charge:")).forEach((k) => { const b = budgetPeriode(B, k, r); const rl = num(f.parCategorie[k.slice(7)]); if (b > 0 && rl > b) A.push({ niv: 1, module: "Budget", texte: `${k.slice(7)} : ${F(rl)} engagés pour ${F(b)} budgétés ce mois-ci`, go: `FSUB='budgets';go('finance')` }); }); } } catch (e) {}
  try { S.produits.filter((p) => p.actif !== false && p.vendable !== false && num(p.prix) > 0).forEach((p) => { const c = coutRevient(p.id).v; if (c > num(p.prix)) A.push({ niv: 2, module: "Produits", texte: `${nomProd(p.id)} : coût de revient (${F(c)}) supérieur au prix de vente (${F(p.prix)})`, go: `editModele('${p.modeleId || p.id}')` }); }); } catch (e) {}
  try { S.clients.filter((c) => num(c.plafond) > 0).forEach((c) => { const enc = encoursClient(c.id); if (enc > num(c.plafond)) A.push({ niv: 2, module: "Clients", texte: `${c.nom} dépasse son plafond de crédit (${F(enc)} / ${F(c.plafond)})`, go: `editClient('${c.id}')` }); }); } catch (e) {}
  return A.sort((a, b) => b.niv - a.niv);
}

/* ---------- synthèse automatique ---------- */
function synthese(type) {
  const ref = today(); const r = range(type, ref), pr = prevRange(type, ref); const f = fin(r), g = fin(pr); const lab = type === "semaine" ? "de la semaine" : "du mois";
  const top = MT.perfPar("produitId", { ventes: ventesR(r), produits: S.produits, modeles: S.modeles })[0]; const A = alertesGlobales();
  const lignes = [`# Synthèse ${lab} · ${perLabel(type, r)}`, "", `${S.param.entreprise || "MATEIÓN"} · générée le ${dfr(ref)} à partir des données enregistrées.`, "", "## Données vérifiées",
    `- Chiffre d'affaires : ${F(f.ca)}${varTxt(f.ca, g.ca)}`, `- Encaissé : ${F(f.encClients)}`, `- Ventes : ${f.nbV} · unités : ${N(f.unites)}`, `- Trésorerie actuelle : ${F(f.tres)}`, `- Créances clients : ${F(f.creances)} · dettes : ${F(f.dettes)}`,
    "", "## Calculs", `- Marge brute : ${F(f.mb)} (${pctI(f.tauxMB)} du CA)`, `- Résultat : ${F(f.resultat)}${varTxt(f.resultat, g.resultat)}`, top ? `- Référence la plus vendue en valeur : ${nomProd(top.key)} (${F(top.ca)})` : "- Aucune vente sur la période",
    "", "## À surveiller", ...(A.length ? A.slice(0, 8).map((a) => `- ${a.module} : ${a.texte}`) : ["- Aucune alerte"]), ""];
  return lignes.join("\n");
}

  const x = h.r; if (!x) return `<div class="card ia"><div class="q">« ${esc(h.q)} »</div><p>Je n'ai pas reconnu cette question. Je ne réponds qu'avec des chiffres calculés sur tes données : reformule, ou choisis une des questions proposées${IQ.sample ? ", ou demande à Claude d'approfondir" : ""}.</p>${h.candidats && h.candidats.length ? `<div class="chips">${h.candidats.map((c) => `<button class="chip" onclick="demander(${esc(JSON.stringify((INTEL.INTENTS.find((i) => i.id === c) || {}).ex || ""))})">${esc((INTEL.INTENTS.find((i) => i.id === c) || {}).ex || c)}</button>`).join("")}</div>` : ""}${IQ.sample ? `<div class="row" style="margin-top:8px"><button class="btn light sm" onclick="approfondir(${esc(JSON.stringify(h.q))})">Approfondir avec Claude</button></div>` : ""}</div>`;

}
function ouvrirNotif() {
  let p = document.getElementById("notif"); if (!p) { p = document.createElement("div"); p.id = "notif"; document.body.appendChild(p); document.addEventListener("click", (e) => { const q = document.getElementById("notif"); if (q && q.classList.contains("on") && !q.contains(e.target) && e.target.id !== "bell") q.classList.remove("on"); }); }
  if (p.classList.contains("on")) { p.classList.remove("on"); return; }
  const A = alertesGlobales();
  p.innerHTML = `<h3>Notifications</h3>${A.length ? A.slice(0, 20).map((a, i) => `<div class="ni" data-i="${i}"><span>${a.niv === 3 ? "⛔" : a.niv === 2 ? "⚠️" : "ℹ️"}</span><div><b>${esc(a.module)}</b>${esc(a.texte)}</div></div>`).join("") : `<p class="muted">Aucune alerte. Tout est à jour.</p>`}${A.length > 20 ? `<p class="muted">… et ${A.length - 20} autre(s).</p>` : ""}<div class="row" style="margin-top:10px"><span class="sp"></span><button class="btn light sm" onclick="document.getElementById('notif').classList.remove('on');IQ.isub='alertes';go('intelligence')">Centre d'alertes</button></div>`;
  p.querySelectorAll(".ni").forEach((el) => (el.onclick = () => { p.classList.remove("on"); const a = A[+el.dataset.i]; const t = document.createElement("button"); t.setAttribute("onclick", a.go); t.click(); }));
  p.classList.add("on");
}
