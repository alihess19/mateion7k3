<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MATEIÓN Business OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&family=Poppins:wght@600;700&display=swap">
<style>
:root{--navy:#1F2A44;--slate:#323D4C;--cream:#F2EEE6;--sand:#E6DDCF;--line:#D6CCBB;--gold:#7A5C25;--goldl:#C9A86A;--ink:#3A4256;--red:#A8322B;--green:#2F6B4F;--white:#FBF9F5}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--navy);font-family:'Jost',Arial,sans-serif;font-size:16px}
header{background:var(--navy);color:var(--cream);padding:18px 20px 0}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:30px;letter-spacing:.14em;margin:0}
.brand span{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--goldl)}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:14px}
nav button{background:none;border:0;color:#C9CFDA;font:inherit;font-size:15px;padding:12px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--cream);border-bottom-color:var(--goldl)}
main{max-width:1180px;margin:0 auto;padding:22px 16px 80px}
h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:30px;margin:6px 0 14px}
h3{font-size:17px;margin:0 0 8px;font-weight:600}
.muted{color:var(--ink);opacity:.8;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.btn{background:var(--navy);color:var(--cream);border:0;border-radius:6px;padding:10px 16px;font:inherit;font-size:15px;cursor:pointer}
.btn.light{background:var(--white);color:var(--navy);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi .l{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.kpi .v{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:600;margin-top:4px}
.kpi .s{font-size:13px;color:var(--ink)}
.kpi.bad{border-color:var(--red)} .kpi.bad .v{color:var(--red)}
.kpi.good .v{color:var(--green)}
.alert{border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:15px}
.alert.bad{background:#F6E3E0;color:#7E231D;border:1px solid #E2B8B2}
.alert.ok{background:#E3EFE8;color:#1F4D38;border:1px solid #B8D5C4}
.alert.info{background:var(--white);border:1px solid var(--line)}
.card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:#F7F3EC;padding:10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid #ECE5D8;vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:#F7F3EC}
.n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.st-attente{background:#EEE7DA;color:#5A4A2A}.st-confection{background:#DCE6EE;color:#1F3A5A}.st-expediee{background:#E4DDF0;color:#43306B}.st-livree{background:#DDEEE3;color:#1F4D38}.st-annulee{background:#F0DCDA;color:#7E231D}
.thumb{width:54px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--sand)}
.mcard img.cover{width:100%;height:220px;object-fit:cover;border-radius:6px;background:var(--sand);display:block;margin-bottom:10px}
.ph{width:100%;height:220px;border-radius:6px;background:var(--sand);display:flex;align-items:center;justify-content:center;color:var(--gold);margin-bottom:10px;font-family:'Cormorant Garamond',serif;font-size:42px}
.overlay{position:fixed;inset:0;background:rgba(20,26,40,.55);display:none;align-items:flex-start;justify-content:center;padding:24px 10px;overflow-y:auto;z-index:20}
.overlay.on{display:flex}
.modal{background:var(--cream);border-radius:10px;width:100%;max-width:760px;padding:20px}
.f{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.f .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink);font-weight:500}
input,select,textarea{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--white);color:var(--navy)}
textarea{min-height:76px;resize:vertical}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.photos .p{position:relative}
.photos .p img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.photos .p button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:11px;border:0;background:var(--red);color:#fff;cursor:pointer;font-size:12px}
.calc{background:var(--navy);color:var(--cream);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.6}
.calc b{color:var(--goldl)}
.note{font-size:13px;color:var(--ink)}
.empty{padding:26px;text-align:center;color:var(--ink);background:var(--white);border:1px dashed var(--line);border-radius:8px}
.bar{height:8px;background:#ECE5D8;border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--navy)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:10px 18px;border-radius:6px;display:none;z-index:30;font-size:14px}
@media(max-width:640px){.f{grid-template-columns:1fr}.brand h1{font-size:24px}}
/* ===== v3 : interface vivante ===== */
header{position:sticky;top:0;z-index:15;background:linear-gradient(180deg,#1A2339 0%,var(--navy) 100%);box-shadow:0 6px 24px rgba(20,26,40,.18)}
.brand{align-items:center}
.brand .wl{width:34px;height:46px;color:var(--cream);flex:none;animation:wsway 7s ease-in-out infinite;transform-origin:50% 0}
@keyframes wsway{0%,100%{transform:rotate(0)}50%{transform:rotate(1.6deg)}}
.brand .live{margin-left:auto;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#C9CFDA;display:flex;align-items:center;gap:7px}
.brand .live i{width:8px;height:8px;border-radius:4px;background:#6FBF8E;box-shadow:0 0 0 0 rgba(111,191,142,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(111,191,142,.55)}70%{box-shadow:0 0 0 9px rgba(111,191,142,0)}100%{box-shadow:0 0 0 0 rgba(111,191,142,0)}}
.code{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:17px;color:var(--goldl);margin-top:6px;opacity:.95}
.thread{display:block;width:100%;height:14px;margin-top:6px}
.thread path{fill:none;stroke:var(--goldl);stroke-width:1.2;stroke-dasharray:6 7;animation:sew 9s linear infinite;opacity:.8}
@keyframes sew{to{stroke-dashoffset:-260}}
nav button{transition:color .25s,border-color .25s}
nav button:hover{color:var(--cream)}
main.enter>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kpi,.card,.mcard{transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
.kpi:hover,.card.hov:hover,.mcard:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(31,42,68,.10);border-color:var(--goldl)}
.mcard img.cover{transition:transform .6s ease}
.mcard{overflow:hidden}
.mcard:hover img.cover{transform:scale(1.03)}
tr.click td{transition:background .2s}
.btn{transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(31,42,68,.18)}
.wm{position:fixed;right:-40px;bottom:-30px;width:300px;height:404px;color:var(--navy);opacity:.035;pointer-events:none;z-index:0}
main{position:relative;z-index:1}
footer{position:relative;z-index:1;text-align:center;padding:30px 10px 46px;color:var(--ink)}
footer svg{width:22px;height:30px;color:var(--gold);display:block;margin:0 auto 8px}
footer .it{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:20px;color:var(--navy)}
footer .s{font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-top:4px;opacity:.7}
.splash{position:fixed;inset:0;background:var(--navy);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .7s ease,visibility .7s}
.splash.off{opacity:0;visibility:hidden}
.splash svg.w{width:84px;height:113px;color:var(--cream);animation:wdrop 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes wdrop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.splash .t{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:30px;color:var(--cream);letter-spacing:.06em;animation:rise .9s .35s both}
.splash .l{width:180px;height:1px;background:linear-gradient(90deg,transparent,var(--goldl),transparent);transform-origin:left;animation:line 1.2s .5s cubic-bezier(.6,0,.2,1) both}
@keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hero{position:relative;overflow:hidden;background:var(--navy);color:var(--cream);border-radius:12px;padding:22px 22px 20px;margin-bottom:16px}
.hero .ey{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--goldl)}
.hero .q{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:26px;line-height:1.25;margin:8px 0 6px;max-width:760px}
.hero .m{font-size:14px;color:#C9CFDA}
.hero svg.bgw{position:absolute;right:18px;top:50%;width:110px;height:148px;transform:translateY(-50%);color:var(--cream);opacity:.08}
.hero .cd{display:inline-flex;gap:8px;align-items:baseline;margin-top:12px;border:1px solid rgba(201,168,106,.5);border-radius:30px;padding:6px 14px;font-size:14px}
.hero .cd b{white-space:nowrap;font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--goldl)}
.fil{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:4px 0 18px;position:relative}
.fil:before{content:"";position:absolute;left:10%;right:10%;top:23px;border-top:1.5px dashed var(--goldl)}
.fil .e{text-align:center;position:relative;padding:0 4px}
.fil .e .o{width:46px;height:46px;border-radius:23px;margin:0 auto 8px;background:var(--white);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;position:relative;transition:transform .3s}
.fil .e.on .o{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.fil .e:hover .o{transform:scale(1.08)}
.fil .e .p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;line-height:1.15}
.fil .e .f{font-size:12px;color:var(--ink);opacity:.8;margin-top:2px}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.val{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px 16px;transition:transform .25s,box-shadow .25s}
.val:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(31,42,68,.10)}
.val .nm{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600}
.val .t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.val .d{font-size:13px;color:var(--ink);margin-top:6px;min-height:34px}
.val .r{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;margin-top:4px}
.val .bar i{transition:width 1s cubic-bezier(.2,.7,.2,1)}
.val.ok .r{color:var(--green)}.val.ok .bar i{background:var(--green)}
.val.ko .r{color:var(--red)}.val.ko .bar i{background:var(--red)}
.val.mid .r{color:var(--gold)}.val.mid .bar i{background:var(--gold)}
.sec{display:flex;align-items:center;gap:12px;margin:22px 0 12px}
.sec h3{margin:0;font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600}
.sec:after{content:"";flex:1;border-top:1px solid var(--line)}
.sec svg{width:14px;height:19px;color:var(--gold);flex:none}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;background:var(--sand);color:var(--navy);font-size:12px;margin:2px 4px 2px 0;cursor:pointer;transition:background .2s}
.chip:hover{background:var(--goldl)}
a.lk{color:var(--navy);text-decoration:none;border-bottom:1px solid var(--goldl);cursor:pointer}
.qp{display:flex;gap:8px;align-items:center}
.qp input{width:120px;padding:6px 8px;font-size:14px}
@media(max-width:640px){.fil .e .p{font-size:14px}.fil .e .f{display:none}.brand .live span{display:none}.hero .q{font-size:22px}.hero svg.bgw{display:none}}

/* ===== v4 : 3D et transitions ===== */
main{perspective:1400px;transform-style:preserve-3d}
main.enter>*{animation:rise3d .7s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--i,0)*55ms);transform-origin:50% 0}
@keyframes rise3d{from{opacity:0;transform:perspective(1000px) rotateX(-16deg) translateY(22px) translateZ(-40px)}to{opacity:1;transform:none}}
main.out{animation:out var(--od,.28s) cubic-bezier(.5,0,.75,0) both}
main.out.l{--dir:-1}main.out.r{--dir:1}
@keyframes out{to{opacity:0;transform:perspective(1400px) rotateY(calc(var(--dir,1)*-10deg)) translateX(calc(var(--dir,1)*-60px)) translateZ(-120px)}}
main.in{animation:in .6s cubic-bezier(.2,.75,.2,1) both}
main.in.l{--dir:-1}main.in.r{--dir:1}
@keyframes in{from{opacity:0;transform:perspective(1400px) rotateY(calc(var(--dir,1)*10deg)) translateX(calc(var(--dir,1)*60px)) translateZ(-120px)}to{opacity:1;transform:none}}
.kpis>*,.vals>*,.grid>*,.fil>*{animation:card3d .7s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--j,0)*60ms + 120ms)}
@keyframes card3d{from{opacity:0;transform:perspective(900px) rotateY(-24deg) rotateX(8deg) translateZ(-60px)}to{opacity:1;transform:none}}
.still .kpis>*,.still .vals>*,.still .grid>*,.still .fil>*{animation:none}
.tilt{transform-style:preserve-3d;will-change:transform;transition:transform .35s cubic-bezier(.2,.75,.2,1),box-shadow .35s,border-color .25s!important}
.tilt.t-on{transition:transform .08s linear,box-shadow .35s!important;box-shadow:0 18px 36px rgba(31,42,68,.16)!important;border-color:var(--goldl)!important}
.tilt .v,.tilt .r,.tilt .nm,.tilt .q{transform:translateZ(26px)}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.35),transparent 55%);opacity:0;transition:opacity .3s}
.tilt.t-on::after{opacity:1}
.kpi,.val{position:relative}
.kpi:hover,.mcard:hover,.val:hover{transform:none}
.w3d{position:relative;transform-style:preserve-3d;animation:spin3d 14s linear infinite}
.w3d svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes spin3d{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.hero .w3w{position:absolute;right:46px;top:50%;width:92px;height:124px;margin-top:-62px;perspective:600px}
.hero .w3w .w3d{width:100%;height:100%}
.splash .w3w{width:96px;height:129px;perspective:700px}
.splash .w3w .w3d{width:100%;height:100%;animation:spin3d 2.4s cubic-bezier(.4,0,.2,1) 1 both}
.fil .e .o{transform-style:preserve-3d}
.fil .e.on .o{animation:coin 6s ease-in-out infinite;animation-delay:calc(var(--j,0)*.4s)}
@keyframes coin{0%,80%,100%{transform:rotateY(0)}90%{transform:rotateY(180deg)}}
nav button{position:relative}
nav button.on{animation:navon .45s cubic-bezier(.2,.75,.2,1)}
@keyframes navon{from{transform:perspective(300px) rotateX(70deg);opacity:.4}to{transform:none;opacity:1}}
.overlay.on .modal{animation:modal3d .5s cubic-bezier(.2,.75,.2,1) both}
@keyframes modal3d{from{opacity:0;transform:perspective(1200px) rotateX(18deg) translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:640px){.hero .w3w{display:none}}
@media(hover:none){.tilt::after{display:none}}

/* ===== v5 : transitions variées ===== */
body{background:radial-gradient(1200px 700px at 85% -10%,rgba(201,168,106,.13),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(31,42,68,.08),transparent 60%),var(--cream);background-attachment:fixed}
nav{position:relative}
nav button.on{border-bottom-color:transparent!important;animation:none}
#ind{position:absolute;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--goldl) 20%,#F1D9A6 50%,var(--goldl) 80%,transparent);border-radius:2px;transition:left .55s cubic-bezier(.6,-.25,.2,1.3),width .55s cubic-bezier(.6,-.25,.2,1.3);box-shadow:0 0 10px rgba(201,168,106,.7)}
#glow{position:fixed;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(201,168,106,.13),transparent 62%);transition:transform .25s ease-out;left:0;top:0}
#veil{position:fixed;inset:0;z-index:40;pointer-events:none;display:none;align-items:center;justify-content:center;background:var(--navy)}
#veil.on{display:flex}
#veil .vw{width:70px;height:94px;color:var(--goldl)}
#veil .vt{position:absolute;bottom:38%;font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--cream);font-size:26px;letter-spacing:.08em;margin-bottom:-90px}
#needle{position:fixed;left:0;right:0;top:50%;height:2px;z-index:41;pointer-events:none;display:none}
#needle.on{display:block}
#needle i{position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--goldl),#F6E2B5);transform-origin:left;box-shadow:0 0 14px rgba(201,168,106,.9)}
#needle b{position:absolute;top:-9px;width:46px;height:20px}
main.enter[data-st="gauche"]>*{animation-name:stL}
main.enter[data-st="zoom"]>*{animation-name:stZ}
main.enter[data-st="flou"]>*{animation-name:stB}
main.enter[data-st="bascule"]>*{animation-name:stF;transform-origin:50% 100%}
main.enter[data-st="vague"]>*{animation-name:stW}
@keyframes stL{from{opacity:0;transform:translateX(-50px) rotateY(18deg)}to{opacity:1;transform:none}}
@keyframes stZ{from{opacity:0;transform:scale(.88) translateZ(-80px)}to{opacity:1;transform:none}}
@keyframes stB{from{opacity:0;filter:blur(14px);transform:scale(1.04)}to{opacity:1;filter:none;transform:none}}
@keyframes stF{from{opacity:0;transform:perspective(900px) rotateX(55deg)}to{opacity:1;transform:none}}
@keyframes stW{0%{opacity:0;transform:translateY(40px) skewY(3deg)}60%{opacity:1;transform:translateY(-6px) skewY(-.5deg)}100%{opacity:1;transform:none}}
main[data-ct="pile"] .kpis>*,main[data-ct="pile"] .vals>*,main[data-ct="pile"] .grid>*,main[data-ct="pile"] .fil>*{animation-name:cPile}
main[data-ct="pop"] .kpis>*,main[data-ct="pop"] .vals>*,main[data-ct="pop"] .grid>*,main[data-ct="pop"] .fil>*{animation-name:cPop}
main[data-ct="carte"] .kpis>*,main[data-ct="carte"] .vals>*,main[data-ct="carte"] .grid>*,main[data-ct="carte"] .fil>*{animation-name:cFlip}
main[data-ct="pluie"] .kpis>*,main[data-ct="pluie"] .vals>*,main[data-ct="pluie"] .grid>*,main[data-ct="pluie"] .fil>*{animation-name:cRain}
@keyframes cPile{from{opacity:0;transform:translateY(60px) translateZ(-120px) rotateX(30deg)}to{opacity:1;transform:none}}
@keyframes cPop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.04)}100%{transform:none}}
@keyframes cFlip{from{opacity:0;transform:perspective(900px) rotateY(180deg)}to{opacity:1;transform:none}}
@keyframes cRain{from{opacity:0;transform:translateY(-70px) rotate(-4deg)}to{opacity:1;transform:none}}
tbody tr,table tr{animation:none}
main.enter table tr{animation:row .5s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--r,0)*40ms + 200ms)}
@keyframes row{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
main.still table tr{animation:none}
.hero{background:linear-gradient(120deg,#1A2339,#26355A 45%,#1F2A44 70%,#2D2A3A);background-size:250% 250%;animation:sheen 14s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

 --navy:var(--tx);--cream:var(--bg);--white:var(--sf);--sand:var(--sf2);--line:var(--ln);--ink:var(--tx2);--gold:var(--ac);--goldl:var(--acl);--slate:#2A2A2E;color-scheme:light}

header{background:var(--hd);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);color:var(--hdt);border-bottom:1px solid var(--ln);box-shadow:0 8px 28px rgba(31,31,34,.08)}

.tg{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--hdt);background:linear-gradient(90deg,#ECE9E3 50%,#232326 50%);transition:transform .6s cubic-bezier(.6,-.3,.3,1.4)}

@supports (animation-timeline:scroll()){.code,.thread{animation:hd linear both;animation-timeline:scroll(root);animation-range:0 140px}@keyframes hd{to{opacity:0;max-height:0;margin:0}}.code{max-height:30px;overflow:hidden}.thread{max-height:14px}}

:root[data-theme="bordeaux"]{--bg:#22111A;--sf:#2D1722;--sf2:#3A1F2C;--tx:#F5E9EC;--tx2:#C49FAA;--ln:#4A2838;--ac:#E8B98A;--acl:#D9A06A;--hd:rgba(34,17,26,.88);--hdt:#F5E9EC;--red:#FF9C8C;--green:#A6D3A2;--ind:#B9C3F2;--plum:#F0B8D6;color-scheme:dark}
:root[data-theme="ocean"]{--bg:#E3EEF0;--sf:#F1F7F8;--sf2:#D2E3E7;--tx:#0E2A33;--tx2:#4A6A73;--ln:#BFD6DC;--ac:#0F7A86;--acl:#4FB3BD;--hd:rgba(241,247,248,.88);--hdt:#0E2A33;--red:#C0503D;--green:#2F7D5B;--ind:#2D4F8A;--plum:#6A4C8A}
:root[data-theme="lavande"]{--bg:#ECE8F3;--sf:#F6F3FA;--sf2:#DFD8EB;--tx:#231B33;--tx2:#665C7A;--ln:#D2C9E2;--ac:#6B4FA8;--acl:#A58AD8;--hd:rgba(246,243,250,.88);--hdt:#231B33;--red:#B84A5A;--green:#4B7D5A;--ind:#3D4B9A;--plum:#8A3D84}
:root[data-theme="moutarde"]{--bg:#F1E8CF;--sf:#F8F2E0;--sf2:#E6DAB6;--tx:#2A2210;--tx2:#6E6040;--ln:#DCCDA2;--ac:#9A6A00;--acl:#D4A21C;--hd:rgba(248,242,224,.88);--hdt:#2A2210;--red:#B4462E;--green:#5A7A2E;--ind:#3A4C7A;--plum:#7A4466}
:root[data-theme="rose"]{--bg:#F3E6E6;--sf:#FAF1F0;--sf2:#EBD6D5;--tx:#2E1A1D;--tx2:#7A5A5E;--ln:#E3C8C8;--ac:#A8435A;--acl:#D98A9B;--hd:rgba(250,241,240,.88);--hdt:#2E1A1D;--red:#B8402E;--green:#4F7A5A;--ind:#3E4C86;--plum:#7E3E78}
:root[data-theme="roi"]{--bg:#E6EAF5;--sf:#F3F5FB;--sf2:#D5DCEE;--tx:#0E1A3A;--tx2:#4D5A80;--ln:#C4CEE8;--ac:#1F45B5;--acl:#E0B451;--hd:rgba(14,26,58,.94);--hdt:#F3F5FB;--red:#B8402E;--green:#2E7A52;--ind:#1F45B5;--plum:#6A3D9A}
:root[data-theme="corail"]{--bg:#1A1A2E;--sf:#22223A;--sf2:#2C2C48;--tx:#F2EFF7;--tx2:#A9A6C2;--ln:#363657;--ac:#FF8A6B;--acl:#FFB199;--hd:rgba(26,26,46,.88);--hdt:#F2EFF7;--red:#FF8E8E;--green:#7FD8B0;--ind:#9FB2FF;--plum:#E0A8FF;color-scheme:dark}
:root[data-theme="roi"] header .ib{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#F3F5FB}:root[data-theme="roi"] header .ib kbd{border-color:rgba(255,255,255,.3)}:root[data-theme="roi"] nav button{color:rgba(243,245,251,.6)}:root[data-theme="roi"] nav button.on,:root[data-theme="roi"] nav button:hover{color:#fff}:root[data-theme="roi"] .brand span{color:#E0B451}:root[data-theme="roi"] .code,:root[data-theme="roi"] .brand .live{color:rgba(243,245,251,.72)}:root[data-theme="roi"] .tg{background:linear-gradient(90deg,#F3F5FB 50%,#0E1A3A 50%)}
#pal{width:340px}
#pal .g{grid-template-columns:repeat(3,1fr)}
#pal button{flex-direction:column;align-items:flex-start;gap:6px;font-size:13px}
#pal .sw{width:100%;height:34px;border-radius:9px}
#pal .sw i{width:34%;height:100%}
/* aurore : halos lents aux couleurs du thème */
.aur{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aur i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.16;background:var(--acl);animation:aur 26s ease-in-out infinite alternate}
.aur i:nth-child(2){background:var(--ac);left:55%;top:40%;animation-duration:32s;animation-delay:-8s;opacity:.11}
.aur i:nth-child(3){background:var(--ind);left:10%;top:60%;animation-duration:38s;animation-delay:-14s;opacity:.08}
@keyframes aur{0%{transform:translate(-10%,-10%) scale(1)}50%{transform:translate(20%,10%) scale(1.15)}100%{transform:translate(-5%,25%) scale(.95)}}
/* fil qui suit le curseur */
#trail{position:fixed;inset:0;z-index:4;pointer-events:none}
/* reflet qui traverse les titres de cartes au chargement */
main.enter .kpi .v,main.enter .val .r{background:linear-gradient(100deg,currentColor 40%,var(--acl) 50%,currentColor 60%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:vsh 1.6s .4s ease-out both}
@keyframes vsh{from{background-position:100% 0}to{background-position:0 0}}
/* boutons magnétiques et ondulation au clic */
.btn,.ib,.fab{will-change:transform}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
/* pages A4 : modèles en grille */
.pg .ims.many div{flex:1 1 45%;height:230px}
.pg td.u{color:#8a8a8a;text-align:right;font-size:12px;white-space:nowrap}
.pg th.r{text-align:right}
.ldw{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:#1F1F22;display:flex;align-items:center;justify-content:center}.ldw .w3w{width:40px;height:54px;perspective:500px;position:relative}.ldw .w3d{width:100%;height:100%;animation-duration:3s}
.trw{margin:0 auto 12px;max-width:794px;padding:10px 14px;border-radius:10px;font-size:14px}

/* ===== v10 : animations de fil ===== */
#prog{position:fixed;left:0;right:0;top:0;height:3px;z-index:17;pointer-events:none}
#prog svg{width:100%;height:12px;display:block;overflow:visible}
#prog .t{fill:none;stroke:var(--acl);stroke-width:1.6;stroke-dasharray:6 5}
#prog .n{fill:var(--tx)}
.sec h3{position:relative}
.sec:after{border-top:0;height:2px;background:repeating-linear-gradient(90deg,var(--acl) 0 7px,transparent 7px 13px);opacity:.7;transform-origin:left;animation:stitchIn 1.4s cubic-bezier(.6,0,.2,1) both}
@keyframes stitchIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.card:hover,.rpc:hover{outline:1.5px dashed var(--acl);outline-offset:4px;transition:outline-offset .3s}
.stc{position:fixed;z-index:60;pointer-events:none;width:22px;height:22px;margin:-11px 0 0 -11px}
.stc i{position:absolute;left:50%;top:50%;width:16px;height:2px;margin:-1px 0 0 -8px;background:var(--acl);border-radius:1px;animation:stc .9s ease-out forwards}
.stc i:nth-child(2){transform:rotate(90deg)}
@keyframes stc{0%{opacity:0;transform:rotate(var(--r,45deg)) scaleX(0)}30%{opacity:1;transform:rotate(var(--r,45deg)) scaleX(1)}100%{opacity:0;transform:rotate(var(--r,45deg)) scaleX(1) translateY(-14px)}}
.hero .sew{position:absolute;inset:0;pointer-events:none;opacity:.45}
.hero .sew path{fill:none;stroke:#C2A266;stroke-width:1.2;stroke-dasharray:8 7;animation:sewh 14s linear infinite}
@keyframes sewh{to{stroke-dashoffset:-600}}
.hero .sew circle{fill:#ECE9E3}
footer .wv{display:block;margin:0 auto 10px;width:min(900px,90%);height:26px}
footer .wv path{fill:none;stroke:var(--acl);stroke-width:1.3;stroke-dasharray:7 6;animation:sewh 20s linear infinite}
#sheetload{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;color:#ECE9E3;text-align:center;font-size:18px;gap:14px}
#sheetload.on{display:flex}
#sheetload small{opacity:.7;font-size:14px}
.spool{width:120px;height:120px}
.spool svg{width:100%;height:100%}
.sp-th{fill:none;stroke:#C2A266;stroke-width:2.5;stroke-dasharray:9 7;animation:sewh 3s linear infinite}
.sp-n{fill:#ECE9E3;transform-origin:60px 40px;animation:needle 1.1s ease-in-out infinite}
@keyframes needle{0%,100%{transform:translateY(-12px)}50%{transform:translateY(18px)}}
#tv{position:fixed;inset:0;z-index:41;pointer-events:none;display:none}
#tv.on{display:block}
#tv path{fill:none;stroke:var(--acl);stroke-width:2.2;stroke-dasharray:10 8}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== MATEIÓN ===== */
:root,:root[data-theme="mateion"]{--bg:#E7EDF0;--sf:#F6F9FA;--sf2:#D6E0E5;--tx:#16191C;--tx2:#56616A;--ln:#CCD7DD;--ac:#9E2B25;--acl:#C9564A;--hd:rgba(246,249,250,.86);--hdt:#16191C;--red:#B3261E;--green:#2E7A52;--ind:#2D4F8A;--plum:#6A4C8A;color-scheme:light}
:root[data-theme="nuit"]{--bg:#121417;--sf:#1A1D21;--sf2:#23272C;--tx:#E9EDF0;--tx2:#9AA4AC;--ln:#2C3137;--ac:#E0A14B;--acl:#E8B565;--hd:rgba(18,20,23,.88);--hdt:#E9EDF0;--red:#F08A80;--green:#7FCB9C;--ind:#A9BCE8;--plum:#CDB2DA;color-scheme:dark}
:root[data-theme="noir"]{--bg:#0E0E0F;--sf:#18181A;--sf2:#222225;--tx:#EEF2F4;--tx2:#A0A6AA;--ln:#2B2B2F;--ac:#D6E0E5;--acl:#B9C7CE;--hd:rgba(14,14,15,.88);--hdt:#EEF2F4;--red:#F08A80;--green:#7FCB9C;--ind:#A9BCE8;--plum:#CDB2DA;color-scheme:dark}
:root[data-theme="pimente"]{--bg:#F4EAE4;--sf:#FBF5F1;--sf2:#EBD9CF;--tx:#24120E;--tx2:#6E5048;--ln:#E2CBBE;--ac:#B3261E;--acl:#D9573F;--hd:rgba(251,245,241,.88);--hdt:#24120E;--red:#B3261E;--green:#3F7A4A;--ind:#3D4B73;--plum:#6A4C78;color-scheme:light}
:root{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300}
:root[data-theme="nuit"],:root[data-theme="noir"],:root[data-theme="indigo"]{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#0ca30c}
.brand h1{font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:.2em}
.brand .mono{width:38px;height:38px;border-radius:50%;background:var(--tx);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22px;flex:none}
.sec:after{border-top:1px solid var(--ln)!important;height:0!important;background:none!important;animation:none!important;opacity:1!important}
.sec .dot{width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none}
.sec{margin:4px 0 12px}
.perbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sf2);border-radius:22px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--tx2);font:inherit;font-size:13px;padding:7px 12px;border-radius:18px;cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.ib2{width:32px;height:32px;border-radius:16px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);cursor:pointer;font-size:18px;line-height:1}
.pl{font-size:13px;color:var(--tx2);white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input{flex:1;min-width:200px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.grid2 .card,.grid3 .card{margin:0}
.card table{border:0;background:transparent}
.ch{width:100%;height:auto;display:block}
.ch .cg{stroke:var(--ln);stroke-width:1}
.ch .ct{fill:var(--tx2);font-size:11px;font-family:Jost,Arial,sans-serif}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2);margin:-4px 0 6px}
.leg i,#chtip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#chtip{position:fixed;z-index:70;display:none;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.18);pointer-events:none;min-width:160px}
#chtip b{font-weight:600}
.kpi .dl{font-size:12px;font-weight:600;margin-left:4px;white-space:nowrap}
.kpi .dl.up{color:var(--green)}.kpi .dl.down{color:var(--red)}
.kpi.warn{border-color:var(--acl)}.kpi.warn .v{color:var(--ac)}
.kpi.good .v{color:var(--green)}
tr.off td{opacity:.5;text-decoration:line-through}
.btn.inv{background:#F6F9FA;color:#16191C}
.ml{font-size:13px;color:var(--ink);font-weight:500;margin-bottom:6px}
.splash .wmk{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:46px;letter-spacing:.32em;color:#EEF2F4;margin-right:-.32em;animation:rise .9s .1s both}
.splash .sg{font-family:'Cormorant Garamond',serif;font-style:italic;color:#D6E0E5;font-size:20px;animation:rise .9s .5s both}
.mcard h3{margin-top:4px}
.fab span.t{display:inline}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.perbar .pl{display:none}h2{font-size:26px}}
html{background:var(--bg)}
.kpi .l,th{color:var(--tx2)!important}
.val .t{color:var(--tx2)}

/* ===== MATEIÓN · thèmes packaging & effets kilichi ===== */
:root[data-theme="spimente"]{--bg:#4A161B;--sf:#561B21;--sf2:#652329;--tx:#F6EFE4;--tx2:#DCC6BA;--ln:#73323A;--ac:#D9B465;--acl:#E8C981;--hd:rgba(74,22,27,.9);--hdt:#F6EFE4;--red:#FF9F8C;--green:#A8D69C;--ind:#BCC8EF;--plum:#DFBBE7;--ink:#E9DCCF;--line:#73323A;--white:#561B21;--navy:#F6EFE4;color-scheme:dark}
:root[data-theme="snonpimente"]{--bg:#1F2125;--sf:#282B30;--sf2:#32353B;--tx:#F4EEE3;--tx2:#BCB4A7;--ln:#3C3F46;--ac:#C9A86A;--acl:#DDBF86;--hd:rgba(31,33,37,.9);--hdt:#F4EEE3;--red:#F2937F;--green:#A1CD96;--ind:#B0C1EB;--plum:#D7B8E0;--ink:#E2DACD;--line:#3C3F46;--white:#282B30;--navy:#F4EEE3;color-scheme:dark}
:root[data-theme="spimente"],:root[data-theme="snonpimente"]{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#0ca30c}
:root[data-theme="spimente"] .btn:not(.light):not(.inv):not(.red){background:linear-gradient(180deg,#A9352E,#7E2224);color:#F6EFE4;box-shadow:inset 0 0 0 1px rgba(246,239,228,.28)}
:root[data-theme="snonpimente"] .btn:not(.light):not(.inv):not(.red){background:linear-gradient(180deg,#D7B878,#B8955A);color:#1F2125}
:root[data-theme="spimente"] body,:root[data-theme="snonpimente"] body{background:var(--bg)}
:root[data-theme="spimente"] .btn.light,:root[data-theme="snonpimente"] .btn.light{background:var(--sf2);color:var(--tx);border-color:var(--ln)}
:root[data-theme="spimente"] input,:root[data-theme="spimente"] select,:root[data-theme="spimente"] textarea,:root[data-theme="snonpimente"] input,:root[data-theme="snonpimente"] select,:root[data-theme="snonpimente"] textarea{background:var(--sf2);color:var(--tx);border-color:var(--ln)}

/* logo dans l'en-tête */
.brand .logo{height:34px;width:auto;flex:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.25));transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.brand .logo:hover{transform:rotate(-4deg) scale(1.08)}
.brand h1.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* séchoir : lanières de kilichi qui sèchent */
.sech{flex:1;min-width:120px;max-width:300px;height:36px;margin:0 6px;align-self:center;position:relative}
.sech svg{width:100%;height:100%;overflow:visible}
.sech .rope{fill:none;stroke:var(--tx2);stroke-width:1.2;opacity:.6}
.sech .st{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.6s ease-in-out infinite alternate}
.sech .st path{fill:url(#meat)}
.sech .st circle{fill:#D9573F}
.sech .pin{fill:var(--ac)}
.sech.gust .st{animation:gust .9s cubic-bezier(.3,1.4,.5,1) 2 alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
@keyframes gust{from{transform:rotate(-24deg)}to{transform:rotate(18deg)}}
.sech .wisp{fill:none;stroke:var(--tx2);stroke-width:1;stroke-linecap:round;opacity:0;animation:wisp 5s ease-out infinite}
@keyframes wisp{0%{opacity:0;transform:translateY(6px)}30%{opacity:.45}100%{opacity:0;transform:translateY(-14px)}}
@media(max-width:760px){.sech{display:none}}

/* fumée ambiante */
.smk{position:fixed;right:2vw;bottom:-8vh;width:280px;height:80vh;pointer-events:none;z-index:0}
.smk i{position:absolute;bottom:0;left:40%;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--tx2) 45%,transparent),transparent 70%);filter:blur(16px);opacity:0;animation:smk 15s linear infinite}
.smk i:nth-child(2){left:18%;animation-delay:-5s;animation-duration:17s}
.smk i:nth-child(3){left:58%;animation-delay:-10s;animation-duration:13s}
@keyframes smk{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.45}60%{transform:translate(-50px,-48vh) scale(1.5);opacity:.22}100%{transform:translate(30px,-78vh) scale(2.3);opacity:0}}

/* écran d'ouverture */
.splash{background:radial-gradient(120% 90% at 50% 40%,#5E1C22,#24090C)!important;gap:14px!important;overflow:hidden}
.splash .spk{position:relative;width:min(300px,70vw);aspect-ratio:300/168}
.splash .hx{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.splash .hx path{fill:none;stroke:#F6EFE4;stroke-width:3;stroke-dasharray:820;stroke-dashoffset:820;animation:hxd 1s .1s cubic-bezier(.6,0,.2,1) forwards,hxo .5s 1.05s forwards}
@keyframes hxd{to{stroke-dashoffset:0}}@keyframes hxo{to{opacity:0}}
.splash .lg{position:absolute;inset:0;width:100%;height:100%;opacity:0;animation:lgin .7s .85s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes lgin{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.splash .kil{font-family:'Poppins','Jost',sans-serif;font-weight:600;font-size:clamp(54px,14vw,96px);line-height:1;color:#F6EFE4;letter-spacing:-.01em;display:flex}
.splash .kil span{display:inline-block;opacity:0;transform:translateY(30px) rotate(-8deg);animation:kl .6s calc(1.05s + var(--i)*.07s) cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes kl{to{opacity:1;transform:none}}
.splash .sg{font-family:'Jost',sans-serif!important;font-style:normal!important;font-size:15px!important;letter-spacing:.14em;text-transform:uppercase;color:#E8C981!important;animation:rise .8s 1.5s both!important}
.splash .sw{position:absolute;left:50%;bottom:8vh;width:240px;height:40vh;transform:translateX(-50%);pointer-events:none}
.splash .sw i{position:absolute;bottom:0;left:45%;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(246,239,228,.32),transparent 70%);filter:blur(12px);animation:smk 4.5s linear infinite}
.splash .sw i:nth-child(2){left:20%;animation-delay:-1.5s}.splash .sw i:nth-child(3){left:62%;animation-delay:-3s}.splash .sw i:nth-child(4){left:35%;animation-delay:-2.2s;animation-duration:5.5s}

/* barre de chaleur (progression) */
#prog{position:fixed;left:0;top:0;height:3px;width:0;z-index:80;background:linear-gradient(90deg,#F3EEE4,#E2B33F 55%,#C0392B);box-shadow:0 0 12px rgba(226,140,40,.7);opacity:0;pointer-events:none}
#prog .run{position:absolute;right:-12px;top:-1px;width:20px;height:20px;color:#E2B33F}
.run{display:block}.run *{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.run circle{fill:currentColor;stroke:none}
.run .f2{opacity:0;animation:fr .32s steps(1) infinite}.run .f1{animation:fr .32s steps(1) infinite reverse}

/* ============================================================
   MATEIÓN BUSINESS OS — noyau métier (fonctions pures, testées)
   Aucune dépendance au DOM ni à la base : utilisable dans la page
   et dans les tests Node. Toute règle de calcul partagée vit ici.
   ============================================================ */
(function (root) {
  "use strict";
  const SCHEMA_VERSION = 2;

  /* ---------- outils ---------- */
  const num = (v) => { const n = parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
  const round2 = (x) => Math.round(num(x) * 100) / 100;
  const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase().replace(/\s+/g, " ");
  const pad = (n) => String(n).padStart(2, "0");
  /** Date du jour dans le fuseau de l'appareil (corrige le décalage UTC de toISOString). */
  function localDate(d = new Date()) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

  /* ---------- types de produits (nature économique, pas une liste de produits) ---------- */
  const TYPES_PRODUIT = [
    ["fini", "Produit fini (fabriqué)", { stock: "fini", vendable: true, production: true }],
    ["revente", "Produit de négoce (acheté pour revente)", { stock: "fini", vendable: true, production: false }],
    ["semi", "Produit semi-fini", { stock: "semi", vendable: false, production: true }],
    ["matiere", "Matière première / ingrédient", { stock: "matiere", vendable: false, production: false }],
    ["emballage", "Emballage / conditionnement", { stock: "emballage", vendable: false, production: false }],
    ["consommable", "Consommable", { stock: "consommable", vendable: false, production: false }],
    ["service", "Service (sans stock)", { stock: null, vendable: true, production: false }],
  ];
  const typeInfo = (k) => (TYPES_PRODUIT.find((t) => t[0] === k) || TYPES_PRODUIT[0])[2];

  /* ---------- catalogue universel des champs, par section ----------
     Les catégories activent des sections et ajoutent leurs propres champs. */
  const SECTIONS = [
    ["general", "Informations générales"],
    ["commercial", "Informations commerciales"],
    ["logistique", "Logistique"],
    ["conservation", "Conservation & péremption"],
    ["production", "Production"],
    ["specifique", "Champs propres à la catégorie"],

  // champs du modèle (niveau produit). Les champs par variante (SKU, prix, code-barres, stocks…) sont dans le tableau des variantes.
  const FIELDS = [
    { k: "fabricant", s: "general", l: "Fabricant / origine" },
    { k: "taxes", s: "commercial", l: "Taxe applicable (%)", t: "number", hint: "ex. 19,25 pour la TVA au Cameroun" },
    { k: "prixTTC", s: "commercial", l: "Les prix saisis sont TTC", t: "checkbox" },
    { k: "volume", s: "logistique", l: "Volume unitaire", t: "number", u: "L" },
    { k: "dimensions", s: "logistique", l: "Dimensions (L × l × h, cm)" },
    { k: "conditionnement", s: "logistique", l: "Conditionnement", hint: "ex. carton de 24" },
    { k: "colisage", s: "logistique", l: "Unités par colis", t: "number" },
    { k: "emplacement", s: "logistique", l: "Emplacement de stockage" },
    { k: "conservation", s: "conservation", l: "Conditions de conservation", t: "textarea" },
    { k: "dureeVieJours", s: "conservation", l: "Durée de vie (jours)", t: "number" },
    { k: "temperature", s: "conservation", l: "Température de stockage" },
    { k: "composition", s: "production", l: "Composition / fiche technique", t: "textarea" },
    { k: "rendement", s: "production", l: "Rendement attendu (%)", t: "number" },
    { k: "tempsFabMin", s: "production", l: "Temps de fabrication (min / lot)", t: "number" },
    { k: "coutStandard", s: "production", l: "Coût standard (par unité)", t: "number" },
    { k: "controleQualite", s: "production", l: "Points de contrôle qualité", t: "textarea" },
  ];
  /* Modèles de catégories : des points de départ que l'utilisateur choisit puis complète.
     Ce ne sont PAS des listes fermées de produits autorisés. */
  const TEMPLATES = {
    generique: { l: "Générique", sections: ["general", "commercial", "logistique"], champs: [] },
    alimentaire: { l: "Alimentaire", sections: ["general", "commercial", "logistique", "conservation", "production"], champs: [
      { k: "ingredients", l: "Ingrédients", t: "textarea" }, { k: "allergenes", l: "Allergènes" }, { k: "certification", l: "Certification (halal, bio…)" }] },
    boisson: { l: "Boisson", sections: ["general", "commercial", "logistique", "conservation", "production"], champs: [
      { k: "ingredients", l: "Ingrédients", t: "textarea" }, { k: "degre", l: "Degré d'alcool (%)", t: "number" }, { k: "consigne", l: "Emballage consigné", t: "checkbox" }] },
    transforme: { l: "Produit transformé", sections: ["general", "commercial", "logistique", "conservation", "production"], champs: [] },
    industriel: { l: "Industriel", sections: ["general", "commercial", "logistique", "production"], champs: [
      { k: "materiau", l: "Matériau" }, { k: "normes", l: "Normes / homologations" }, { k: "garantieMois", l: "Garantie (mois)", t: "number" }] },
    artisanal: { l: "Artisanal", sections: ["general", "commercial", "logistique", "production"], champs: [
      { k: "materiaux", l: "Matériaux" }, { k: "artisan", l: "Artisan / atelier" }, { k: "pieceUnique", l: "Pièce unique", t: "checkbox" }] },
    commercial: { l: "Négoce / revente", sections: ["general", "commercial", "logistique"], champs: [{ k: "refFournisseur", l: "Référence fournisseur" }] },
    matiere: { l: "Matières premières", sections: ["general", "commercial", "logistique", "conservation"], champs: [{ k: "qualite", l: "Qualité / grade" }] },
    service: { l: "Services", sections: ["general", "commercial"], champs: [{ k: "dureeMin", l: "Durée (minutes)", t: "number" }] },
  };

  /* ---------- catégories (arbre extensible) ---------- */
  function categoryChain(id, cats) {
    const out = []; const seen = new Set(); let c = cats.find((x) => x.id === id);
    while (c && !seen.has(c.id)) { seen.add(c.id); out.unshift(c); c = c.parentId ? cats.find((x) => x.id === c.parentId) : null; }
    return out;

  const categoryPath = (id, cats) => categoryChain(id, cats).map((c) => c.nom).join(" › ");

  /** Résout sections et champs applicables : modèle de la catégorie racine + champs propres de chaque niveau. */
  function fieldsFor(categorieId, cats, typeProduit) {
    const chain = categoryChain(categorieId, cats);
    const tplKey = [...chain].reverse().map((c) => c.template).find((t) => t && TEMPLATES[t]) || "generique";
    const tpl = TEMPLATES[tplKey];
    const sections = new Set(tpl.sections);
    sections.add("general"); sections.add("commercial");
    const ti = typeInfo(typeProduit);
    if (ti.production) sections.add("production"); else if (typeProduit === "service" || typeProduit === "revente") sections.delete("production");
    if (typeProduit === "service") { sections.delete("logistique"); sections.delete("conservation"); }
    const champs = [];
    const add = (f) => { if (f && f.k && !champs.some((x) => x.k === f.k)) champs.push(f); };
    tpl.champs.forEach(add);
    chain.forEach((c) => (c.champs || []).forEach(add));
    if (champs.length) sections.add("specifique");

  }

  /* ---------- variantes ---------- */
  function parseValues(str) { return [...new Set(String(str || "").split(/[,;\n]/).map((x) => x.trim()).filter(Boolean))]; }
  /** Produit cartésien des attributs : [{nom:"Format",valeurs:["25 cl","33 cl"]}] → [{Format:"25 cl"},…] */
  function combinations(attributs) {
    const A = (attributs || []).filter((a) => a && String(a.nom || "").trim() && (a.valeurs || []).length);

  /** Libellé complet d'une référence vendable (variante), compatible avec les fiches historiques. */
  function nomVariante(p, modele) {

  /** SKU unique, lisible : PREFIXE-MODELE-ATTR1-ATTR2, suffixé -2, -3… en cas de collision. */
  function genSku(modeleNom, attrs, existing, prefix) {
    const parts = [prefix || "", code(modeleNom, 3).slice(0, 6) || "PRD", ...Object.values(attrs || {}).map((v) => code(v, 4).slice(0, 6))].filter(Boolean);
    const base = parts.join("-"); const taken = new Set((existing || []).map((x) => String(x).toUpperCase()));
    if (!taken.has(base)) return base; let i = 2; while (taken.has(`${base}-${i}`)) i++; return `${base}-${i}`;
  }
  /** Contrôle d'un code EAN-8 / UPC-A / EAN-13 / GTIN-14 (clé de contrôle). */
  function eanValide(c) {

  }

  /* ---------- prix & marges (définitions uniques) ---------- */
  /** Marge sur une vente : montant, taux de marge (sur prix de vente) et coefficient. */
  function marge(prixVente, cout) {
    const p = num(prixVente), c = num(cout);
    return { montant: p - c, taux: p > 0 && c > 0 ? ((p - c) / p) * 100 : null, coef: c > 0 ? p / c : null };
  }
  const prixDepuisTaux = (cout, tauxMarge) => { const t = num(tauxMarge); return t >= 100 ? null : round2(num(cout) / (1 - t / 100)); };
  const htDepuisTTC = (ttc, taux) => round2(num(ttc) / (1 + num(taux) / 100));

  /* ---------- ventes : quantités, chiffre d'affaires, coût des ventes ---------- */
  const qNet = (x) => (x.avoir ? 0 : Math.max(0, num(x.qte) - num(x.retours)));
  function netV(x) { if (x.statut === "annulee") return 0; if (x.avoir) return -Math.abs(num(x.total)); const q = num(x.qte); return q ? (num(x.total) * qNet(x)) / q : 0; }
  /** Coût des ventes : unités conservées par le client + unités retournées abîmées (perte réelle, non remise en stock). */
  function cogsV(x) { if (x.statut === "annulee" || x.avoir) return 0; return (qNet(x) + Math.min(num(x.retoursPerte), num(x.retours))) * num(x.coutUnitaire); }

  /* ---------- validations ---------- */
  function validateModele(m) {
    const e = [];
    if (!String(m.nom || "").trim()) e.push("Le nom du produit est obligatoire.");
    if (m.typeProduit && !TYPES_PRODUIT.some((t) => t[0] === m.typeProduit)) e.push("Type de produit inconnu.");
    return e;
  }
  /** Erreurs bloquantes et avertissements pour un ensemble de variantes à enregistrer. */
  function validateVariantes(rows, others) {
    const errors = [], warnings = [];
    const active = rows.filter((r) => !r.supprimee);
    if (!active.length) errors.push("Au moins une variante (ou référence unique) est nécessaire.");
    const skus = new Map(), eans = new Map();
    (others || []).forEach((o) => { if (o.sku) skus.set(String(o.sku).toUpperCase(), "ext"); if (o.ean) eans.set(String(o.ean), "ext"); });

      const lab = variantLabel(r.attributs) || "référence unique";
      const k = attrKey(r.attributs); if (keys.has(k)) errors.push(`Variante en double : ${lab}.`); keys.add(k);

      if (r.vendable !== false && r.typeVendable && !(num(r.prix) > 0)) errors.push(`${lab} : prix de vente requis pour une référence vendable.`);
      if (num(r.seuilMax) > 0 && num(r.seuil) > num(r.seuilMax)) errors.push(`${lab} : stock minimal supérieur au stock maximal.`);
      if (num(r.prix) > 0 && num(r.prixGros) > num(r.prix)) warnings.push(`${lab} : prix de gros supérieur au prix de détail.`);
    });
    return { errors: [...new Set(errors)], warnings: [...new Set(warnings)] };
  }

  /* ---------- performances par dimension (marque, gamme, catégorie, produit) ---------- */
  /** Regroupe les ventes non annulées par dimension du modèle. Utilise netV/cogsV du noyau : une seule définition. */
  function perfPar(dim, { ventes, produits, modeles }) {
    const P = new Map(produits.map((p) => [p.id, p])), M = new Map(modeles.map((m) => [m.id, m]));
    const out = new Map();
    for (const v of ventes) {
      if (v.statut === "annulee") continue;
      const p = P.get(v.produitId); const m = p && M.get(p.modeleId);
      const key = dim === "produitId" ? v.produitId : dim === "modeleId" ? (p && p.modeleId) || "" : (m && m[dim]) || "";
      const o = out.get(key) || { key, ca: 0, cogs: 0, unites: 0, ventes: 0 };
      o.ca += netV(v); o.cogs += cogsV(v); o.unites += qNet(v); o.ventes += 1; out.set(key, o);
    }
    return [...out.values()].map((o) => ({ ...o, marge: o.ca - o.cogs, taux: o.ca ? ((o.ca - o.cogs) / o.ca) * 100 : null })).sort((a, b) => b.ca - a.ca);
  }

  /* ---------- migration v1 → v2 (plan pur, sans écriture) ---------- */
  /** Construit le plan qui rattache chaque fiche produit historique à un modèle universel.
      Rien n'est supprimé ni écrasé : on AJOUTE modeleId et attributs, les anciens champs restent. */
  function planMigrationV2(S, opts = {}) {
    const produits = (S.produits || []).filter((p) => !p.modeleId);
    const plan = { modeles: [], marques: [], categories: [], updates: [], stockUpdates: [], summary: {} };
    if (!produits.length) { plan.summary = { produits: 0, modeles: 0 }; return plan; }
    let marqueRef = opts.marqueId || "";
    if (!marqueRef && opts.marqueNom && String(opts.marqueNom).trim()) {
      const ex = (S.marques || []).find((m) => norm(m.nom) === norm(opts.marqueNom));
      if (ex) marqueRef = ex.id; else { marqueRef = "tmp:marque"; plan.marques.push({ tmp: marqueRef, data: { nom: String(opts.marqueNom).trim(), slogan: opts.slogan || "", description: opts.description || "", logo: "", logoBuiltin: !!opts.logoBuiltin, couleurs: opts.couleurs || { primaire: "#1F2A44", secondaire: "#C9A86A" }, statut: "active" } }); }
    }
    let catRef = opts.categorieId || "";
    if (!catRef && opts.categorieNom && String(opts.categorieNom).trim()) {
      const ex = (S.categories || []).find((c) => norm(c.nom) === norm(opts.categorieNom) && !c.parentId);
      if (ex) catRef = ex.id; else { catRef = "tmp:cat"; plan.categories.push({ tmp: catRef, data: { nom: String(opts.categorieNom).trim(), parentId: "", template: opts.categorieTemplate || "alimentaire", champs: [], archive: false } }); }
    }
    const stockOf = (pid) => (S.stock || []).find((i) => i.type === "fini" && i.produitId === pid);
    const groups = new Map();
    produits.forEach((p) => { const k = norm(p.nom) || "(sans nom)"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(p); });
    let gi = 0;
    for (const [, L] of groups) {
      const tmp = "tmp:modele:" + gi++;
      const hasSav = L.some((p) => String(p.saveur || "").trim()), hasPoids = L.some((p) => num(p.poids) > 0);
      const attributs = [];
      if (hasSav) attributs.push({ nom: "Saveur", valeurs: [...new Set(L.map((p) => String(p.saveur || "").trim() || "Standard"))] });
      if (hasPoids) attributs.push({ nom: "Format", valeurs: [...new Set(L.map((p) => (num(p.poids) > 0 ? `${num(p.poids)} g` : "Standard")))] });
      const it = stockOf(L[0].id);
      const desc = L.map((p) => p.description).find((d) => String(d || "").trim()) || "";
      plan.modeles.push({ tmp, data: { nom: String(L[0].nom || "Produit").trim(), description: desc, typeProduit: "fini", categorieId: catRef, marqueId: marqueRef, gammeId: "", unite: (it && it.unite) || "unité", statut: L.some((p) => p.actif !== false) ? "actif" : "inactif", photo: (L.find((p) => p.photo) || {}).photo || "", attributs, champs: {}, migreDe: "v1" } });
      L.forEach((p) => {
        const a = {}; if (hasSav) a.Saveur = String(p.saveur || "").trim() || "Standard"; if (hasPoids) a.Format = num(p.poids) > 0 ? `${num(p.poids)} g` : "Standard";
        plan.updates.push({ id: p.id, data: { modeleId: tmp, attributs: a, vendable: true, prixDetail: num(p.prix), statut: p.actif === false ? "inactif" : "actif" } });
      });
    }
    plan.summary = { produits: produits.length, modeles: plan.modeles.length, marques: plan.marques.length, categories: plan.categories.length };
    return plan;
  }
  /** Remplace les références temporaires d'un plan par les identifiants réels créés. */
  function resolveTmp(data, ids) { const o = JSON.parse(JSON.stringify(data)); for (const k of Object.keys(o)) if (typeof o[k] === "string" && ids[o[k]]) o[k] = ids[o[k]]; return o; }

  /* ---------- contrôle d'intégrité ---------- */
  function verifyIntegrity(S) {
    const issues = []; const by = (c) => new Map((S[c] || []).map((x) => [x.id, x]));
    const M = by("modeles"), G = by("gammes"), B = by("marques"), C = by("categories"), P = by("produits");
    const skus = new Map();
    (S.produits || []).forEach((p) => {
      if (!p.modeleId) issues.push({ niveau: "erreur", code: "produit_sans_modele", id: p.id, msg: `Référence « ${p.nom || p.id} » non rattachée à un produit.` });
      else if (!M.has(p.modeleId)) issues.push({ niveau: "erreur", code: "modele_absent", id: p.id, msg: `Référence « ${p.nom || p.id} » : produit parent introuvable.` });
      if (p.sku && p.actif !== false) { const k = String(p.sku).toUpperCase(); if (skus.has(k)) issues.push({ niveau: "avertissement", code: "sku_double", id: p.id, msg: `SKU en double : ${p.sku}.` }); skus.set(k, p.id); }
    });
    (S.modeles || []).forEach((m) => {
      if (m.marqueId && !B.has(m.marqueId)) issues.push({ niveau: "erreur", code: "marque_absente", id: m.id, msg: `Produit « ${m.nom} » : marque introuvable.` });
      if (m.gammeId) { const g = G.get(m.gammeId); if (!g) issues.push({ niveau: "erreur", code: "gamme_absente", id: m.id, msg: `Produit « ${m.nom} » : gamme introuvable.` }); else if (m.marqueId && g.marqueId !== m.marqueId) issues.push({ niveau: "erreur", code: "gamme_hors_marque", id: m.id, msg: `Produit « ${m.nom} » : la gamme n'appartient pas à sa marque.` }); }
      if (m.categorieId && !C.has(m.categorieId)) issues.push({ niveau: "erreur", code: "categorie_absente", id: m.id, msg: `Produit « ${m.nom} » : catégorie introuvable.` });
    });
    (S.gammes || []).forEach((g) => { if (!B.has(g.marqueId)) issues.push({ niveau: "erreur", code: "gamme_orpheline", id: g.id, msg: `Gamme « ${g.nom} » sans marque valide.` }); });
    (S.categories || []).forEach((c) => { if (c.parentId && !canSetParent(c.id, c.parentId, S.categories.map((x) => (x.id === c.id ? { ...x, parentId: "" } : x)))) issues.push({ niveau: "erreur", code: "categorie_cycle", id: c.id, msg: `Catégorie « ${c.nom} » : boucle dans l'arborescence.` }); });
    (S.ventes || []).forEach((v) => { if (v.produitId && !P.has(v.produitId)) issues.push({ niveau: "avertissement", code: "vente_produit_absent", id: v.id, msg: `Vente ${v.num || v.id} : référence produit introuvable.` }); });
    return issues;
  }

  const MT = { SCHEMA_VERSION, num, round2, norm, localDate, TYPES_PRODUIT, typeInfo, SECTIONS, FIELDS, TEMPLATES,
    categoryChain, categoryPath, descendants, canSetParent, fieldsFor, parseValues, combinations, attrKey, variantLabel, nomVariante,
    genSku, eanValide, marge, prixDepuisTaux, htDepuisTTC, qNet, netV, cogsV, validateModele, validateVariantes, perfPar,

<script>
/* ============================================================
   MATEIÓN BUSINESS OS — noyau Fabrication (fonctions pures, testées)
   Recettes (nomenclatures) versionnées, mise à l'échelle, coûts standard,
   répartition des coûts entre coproduits, écarts théorique / réel,
   besoins en matières, suggestions de fabrication, péremption.
   ============================================================ */
(function (root) {
  "use strict";
  const num = (v) => { const n = parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
  const r4 = (x) => Math.round(num(x) * 10000) / 10000;

  /** Lit une recette quel que soit son format (fiche technique historique ou nomenclature v2).
      Format historique : {produitId, composition, conso:[{itemId,qte /unité}]} → base 1 unité. Rien n'est réécrit en base. */
  function normRecette(r) {
    if (!r) return null;
    const legacy = !Array.isArray(r.lignes);
    const lignes = (legacy ? r.conso || [] : r.lignes).filter((l) => l && l.itemId).map((l) => ({ itemId: l.itemId, qte: num(l.qte) }));
    let sorties = Array.isArray(r.sorties) && r.sorties.length ? r.sorties : r.produitId ? [{ produitId: r.produitId, qte: legacy ? 1 : num(r.quantiteBase) || 1, type: "principal", partCout: 100 }] : [];
    sorties = sorties.filter((s) => s && s.produitId).map((s, i) => ({ produitId: s.produitId, qte: num(s.qte), type: i === 0 ? "principal" : s.type === "sousproduit" ? "sousproduit" : "coproduit", partCout: s.partCout === "" || s.partCout === undefined ? (i === 0 ? 100 : 0) : num(s.partCout) }));
    return {
      id: r.id, legacy, nom: r.nom || "", version: num(r.version) || 1, statut: r.statut || "active",
      produitId: (sorties[0] || {}).produitId || r.produitId || "", quantiteBase: (sorties[0] || {}).qte || 1,
      lignes, sorties, mo: num(r.mo), autres: num(r.autres), tempsMin: num(r.tempsMin),
      etapes: r.etapes ?? r.composition ?? "", controles: Array.isArray(r.controles) ? r.controles.filter(Boolean) : [], versions: Array.isArray(r.versions) ? r.versions : [],
    };
  }
  /** Facteur d'échelle pour produire `qte` unités de la sortie principale. */
  const facteur = (rec, qte) => (rec && rec.quantiteBase > 0 ? num(qte) / rec.quantiteBase : 0);
  /** Quantités théoriques (consommations, sorties, coûts fixes de lot) pour une quantité de sortie principale. */

    { id: "rupture", poids: [[/rupture|manquer|epuis|stock faible|stock bas|reapprovision|commander/, 4], [/stock|produit/, 1], [/risque/, 1]], ex: "Quels produits risquent une rupture de stock ?" },
    { id: "marge_reelle", poids: [[/marge/, 4], [/reel|vrai|taux|globale|ma marge/, 2]], ex: "Quelle est ma marge réelle ?" },
    { id: "impayes", poids: [[/impaye|non paye|doivent|doit de l argent|creance|retard de paiement|pas paye|relancer/, 5], [/client|facture/, 1]], ex: "Quels sont mes clients ayant des factures impayées ?" },
    { id: "meilleurs_clients", poids: [[/client/, 2], [/meilleur|top|plus gros|fidele|plus achete|principaux/, 4]], ex: "Qui sont mes meilleurs clients ?" },
    { id: "ca", poids: [[/chiffre d affaire|\b(mon|le|du|notre|son) ca\b|vendu|ventes|vente/, 4], [/combien|total|montant|niveau/, 1]], ex: "Quel est mon chiffre d'affaires ce mois-ci ?" },
    { id: "resultat", poids: [[/benefice|resultat|gagne|perte|rentable globalement|profit/, 5]], ex: "Quel est mon bénéfice ce mois-ci ?" },
    { id: "tresorerie_prevision", poids: [[/tresorerie|caisse|argent|solde|liquidite/, 3], [/prevision|prevoir|futur|semaines|va t|evoluer|sera|devenir|bientot|negati/, 3]], ex: "Comment va évoluer ma trésorerie ?" },
    { id: "tresorerie", poids: [[/tresorerie|caisse|argent disponible|solde|liquidite|en banque|combien j ai/, 4]], ex: "Combien ai-je en trésorerie ?" },
    { id: "peremption", poids: [[/perim|expir|dlc|date limite|peremption/, 5]], ex: "Quels lots arrivent à péremption ?" },
    { id: "stock_valeur", poids: [[/valeur/, 3], [/stock|inventaire/, 3]], ex: "Quelle est la valeur de mon stock ?" },
    { id: "commandes", poids: [[/commande/, 3], [/livrer|en attente|en cours|ouverte/, 3]], ex: "Quelles commandes restent à livrer ?" },
    { id: "alertes", poids: [[/alerte|probleme|surveiller|urgent|priorite|a faire|risque/, 4]], ex: "Qu'est-ce que je dois surveiller en priorité ?" },
  ];
  /** Intention la plus probable (score ≥ 4), avec les autres candidates pour proposer une reformulation. */
  function comprendre(q, today) {
    const s = norm(q); const scores = INTENTS.map((it) => ({ id: it.id, score: it.poids.reduce((a, [re, w]) => a + (re.test(s) ? w : 0), 0) })).sort((a, b) => b.score - a.score);
    const best = scores[0] && scores[0].score >= 4 ? scores[0] : null;
    return { id: best ? best.id : null, score: best ? best.score : 0, candidats: scores.filter((x) => x.score >= 2).slice(0, 3).map((x) => x.id), periode: periode(q, today || iso(new Date())) };
  }
  /** Variation relative en %, null si la base est nulle. */
  const variation = (a, b) => (b ? ((a - b) / Math.abs(b)) * 100 : null);

  const INTEL = { norm, periode, INTENTS, comprendre, variation };
  if (typeof module === "object" && module.exports) module.exports = INTEL; else root.INTEL = Object.freeze(INTEL);
})(typeof window !== "undefined" ? window : globalThis);

<script>
/* ============================================================

const TABS=[["bord","Tableau de bord"],["intelligence","Intelligence"],["ventes","Ventes"],["commerce","Commerce"],["depenses","Dépenses"],["achats","Achats & fournisseurs"],["produits","Produits"],["marques","Marques & gammes"],["stocks","Stocks"],["production","Production"],["clients","Clients"],["tresorerie","Trésorerie"],["finance","Finance"],["creances","Créances & dettes"],["rapports","Rapports"],["param","Paramètres"]];

const TYPES_CPT=["Espèces","Orange Money","MTN Mobile Money","Banque","Autres"];
const PERIODES=[["jour","Jour"],["semaine","Semaine"],["mois","Mois"],["trimestre","Trimestre"],["annee","Année"],["tout","Tout"]];
const S={param:{}};COLS.forEach(c=>S[c]=[]);let SCHEMA={version:0};
let db=null,assets=null,user=null,ME="",tab=(location.hash||"#bord").slice(1),ready={},loaded=false,filtreSt="",anim=true;
if(!TABS.some(t=>t[0]===tab))tab="bord";
let PER={type:"mois",ref:new Date().toISOString().slice(0,10)};
try{const p=JSON.parse(localStorage.getItem("mt_per")||"null");if(p&&p.type)PER.type=p.type}catch(e){}

/* ---------- outils ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0};
const F=v=>Math.round(num(v)).toLocaleString("fr-FR").replace(/[  ]/g," ")+" FCFA";
const N=v=>(Math.round(num(v)*100)/100).toLocaleString("fr-FR").replace(/[  ]/g," ");
const P=(k,d=0)=>S.param[k]===undefined||S.param[k]===""?d:num(S.param[k]);
const today=()=>MT.localDate();
const dfr=d=>d?new Date(String(d).slice(0,10)+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}):"";
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const v=id=>{const e=document.getElementById(id);return e?e.value:""};
const img=id=>(window.__assetUrl?(window.__assetUrl(id)||"/_blob/"+encodeURIComponent(id)):"/_blob/"+encodeURIComponent(id));
function toast(m,undo){const t=$("#toast");t.textContent=m;if(undo){const b=document.createElement("button");b.textContent="Annuler";b.onclick=()=>{t.style.display="none";undo()};t.appendChild(b)}t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",undo?6000:2800)}
function openM(h,wide){$("#modal").innerHTML=h;$("#modal").style.maxWidth=wide?"980px":"";$("#ov").classList.add("on");$("#ov").scrollTop=0}

const opt=(L,sel)=>L.map(x=>{const [k,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(k)}" ${String(k)===String(sel??"")?"selected":""}>${esc(l)}</option>`}).join("");

function sum(L,f){return L.reduce((s,x)=>s+num(f(x)),0)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---------- périodes ---------- */
function range(type,ref){const d=new Date((ref||today())+"T12:00:00");let a,b;
 if(type==="jour"){a=new Date(d);b=new Date(d)}
 else if(type==="semaine"){const w=(d.getDay()+6)%7;a=new Date(d);a.setDate(d.getDate()-w);b=new Date(a);b.setDate(a.getDate()+6)}
 else if(type==="mois"){a=new Date(d.getFullYear(),d.getMonth(),1,12);b=new Date(d.getFullYear(),d.getMonth()+1,0,12)}
 else if(type==="trimestre"){const q=Math.floor(d.getMonth()/3);a=new Date(d.getFullYear(),q*3,1,12);b=new Date(d.getFullYear(),q*3+3,0,12)}
 else if(type==="annee"){a=new Date(d.getFullYear(),0,1,12);b=new Date(d.getFullYear(),11,31,12)}
 else return ["0000-01-01","9999-12-31"];
 return [a.toISOString().slice(0,10),b.toISOString().slice(0,10)]}
function prevRange(type,ref){if(type==="tout")return null;const [a]=range(type,ref);return range(type,addDays(a,-1))}
const inR=(d,r)=>{d=String(d||"").slice(0,10);return d>=r[0]&&d<=r[1]};
function perLabel(type,r){if(type==="tout")return "Depuis le début";const o={day:"numeric",month:"short",year:"numeric"};return type==="jour"?dfr(r[0]):`${dfr(r[0])} – ${dfr(r[1])}`}
function perBar(){const r=range(PER.type,PER.ref);return `<div class="perbar"><div class="seg">${PERIODES.map(([k,l])=>`<button class="${PER.type===k?"on":""}" onclick="setPer('${k}')">${l}</button>`).join("")}</div>${PER.type!=="tout"?`<button class="ib2" onclick="shiftPer(-1)" aria-label="Période précédente">‹</button><span class="pl">${perLabel(PER.type,r)}</span><button class="ib2" onclick="shiftPer(1)" aria-label="Période suivante">›</button>`:`<span class="pl">Toutes les données</span>`}</div>`}
function setPer(t){PER.type=t;PER.ref=today();try{localStorage.setItem("mt_per",JSON.stringify({type:t}))}catch(e){}render()}
function shiftPer(s){const r=range(PER.type,PER.ref);PER.ref=s<0?addDays(r[0],-1):addDays(r[1],1);render()}

/* ---------- écritures : base + journal ---------- */
async function log(action,col,id,resume){try{await db.collection("journal").doc().set({date:new Date().toISOString(),par:ME,action,col,docId:id||"",resume:String(resume||"").slice(0,300)})}catch(e){}}
async function put(col,id,data,resume){if(!db){toast("Base de données indisponible");throw 0}const isNew=!id;const ref=isNew?db.collection(col).doc():db.collection(col).doc(id);
 const d={...data,maj:new Date().toISOString(),majPar:ME};if(isNew){d.cree=d.maj;d.creePar=ME}
 if(isNew)await ref.set(d);else await ref.update(d);
 log(isNew?"création":"modification",col,ref.id,resume);return ref.id}
async function guard(fn,ok){try{const r=await fn();if(ok)toast(ok);return r}catch(e){if(e)toast("Échec : "+(e.code||e.message||"erreur"));return null}}

/* ---------- comptes & opérations (trésorerie = seule source des mouvements d'argent) ---------- */
function opsOf(ref){return S.operations.filter(o=>o.ref===ref&&!o.annule)}
function paidOf(ref){return sum(opsOf(ref),o=>o.sens==="in"?o.montant:-o.montant)}
function paidOut(ref){return sum(opsOf(ref),o=>o.sens==="out"?o.montant:-o.montant)}
function solde(cid){const c=byId("comptes",cid)||{};return num(c.soldeInitial)+sum(S.operations.filter(o=>o.compte===cid&&!o.annule),o=>o.sens==="in"?o.montant:-o.montant)}
function tresorerie(){return sum(S.comptes.filter(c=>!c.archive),c=>solde(c.id))}
function cptOpts(sel){const L=S.comptes.filter(c=>!c.archive);return L.length?opt(L.map(c=>[c.id,c.nom]),sel||(L[0]||{}).id):`<option value="">Crée d'abord un compte (Trésorerie)</option>`}
async function addOp(o){return put("operations",null,{date:o.date||today(),compte:o.compte,sens:o.sens,montant:num(o.montant),type:o.type,ref:o.ref||"",libelle:o.libelle||"",transfert:o.transfert||""},`${o.sens==="in"?"Entrée":"Sortie"} ${F(o.montant)} · ${o.libelle||o.type}`)}

/* ---------- stocks ---------- */
function mvtsOf(id){return S.mouvements.filter(m=>m.itemId===id&&!m.annule)}
function qte(id,until){return sum(mvtsOf(id).filter(m=>!until||String(m.date)<=until),m=>m.qte)}
function cu(id){const E=mvtsOf(id).filter(m=>m.qte>0&&num(m.valeurUnitaire)>0);const q=sum(E,m=>m.qte);const it=byId("stock",id)||{};return q?sum(E,m=>m.qte*m.valeurUnitaire)/q:num(it.coutDefaut)}
function lastMvt(id){const L=mvtsOf(id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));return L[0]}
function stockVal(){return sum(S.stock.filter(i=>!i.archive),i=>Math.max(0,qte(i.id))*cu(i.id))}
function reserve(id){const it=byId("stock",id);if(!it||it.type!=="fini")return 0;return sum(S.ventes.filter(x=>x.statut==="reservee"&&x.produitId===it.produitId),x=>x.qte)}
function lowStock(){return S.stock.filter(i=>!i.archive&&num(i.seuil)>0&&qte(i.id)<=num(i.seuil))}
async function addMvt(m){return put("mouvements",null,{date:m.date||today(),itemId:m.itemId,type:m.type,qte:num(m.qte),valeurUnitaire:num(m.valeurUnitaire),source:m.source||"manuel",ref:m.ref||"",motif:m.motif||""},`${(TYPES_MVT.find(t=>t[0]===m.type)||[,m.type])[1]} ${N(m.qte)} · ${(byId("stock",m.itemId)||{}).nom||""}`)}
function finiOf(pid){return S.stock.find(i=>i.type==="fini"&&i.produitId===pid)}

/* ---------- produits : coût de revient réel ---------- */
function coutRevient(pid){const it=finiOf(pid);const L=S.lots.filter(l=>l.produitId===pid&&!l.annule&&num(l.sachets)>0);
 if(L.length){const q=sum(L,l=>l.sachets);return{v:sum(L,l=>l.total)/q,src:`moyenne de ${L.length} lot(s)`}}
 if(it){const c=cu(it.id);if(c>0)return{v:c,src:"valeur des entrées en stock"}}
 const p=byId("produits",pid)||{};return num(p.coutManuel)>0?{v:num(p.coutManuel),src:"saisi à la main (estimation)"}:{v:0,src:"non renseigné"}}
const nomProd=id=>{const p=byId("produits",id);return MT.nomVariante(p,p&&p.modeleId?byId("modeles",p.modeleId):null)};

/* ---------- ventes ---------- */
function qNet(x){return MT.qNet(x)}
function netV(x){return MT.netV(x)}
function encV(x){return paidOf("ventes/"+x.id)}
function duV(x){return Math.max(0,netV(x)-encV(x))}
function stPay(x){if(x.statut==="annulee")return["st-annulee","Annulée"];const n=netV(x),e=encV(x);if(n<=0)return["st-livree","Soldée"];if(e>=n-0.5)return["st-livree","Payée"];if(e>0)return["st-attente","Partiellement payée"];return["st-annulee","Non payée"]}
function cogsV(x){return MT.cogsV(x)}
function ventesR(r){return S.ventes.filter(x=>x.statut!=="annulee"&&inR(x.date,r))}

/* ---------- dépenses & achats ---------- */
function payD(x){return paidOut("depenses/"+x.id)}
function duD(x){return x.statut==="annulee"?0:Math.max(0,num(x.montant)-payD(x))}
function payA(x){return paidOut("achats/"+x.id)}
function duA(x){return x.statut==="annulee"?0:Math.max(0,num(x.total)-payA(x))}
function stD(du,tot){return du<=0.5?["st-livree","Payée"]:du<tot-0.5?["st-attente","Partiellement payée"]:["st-annulee","Non payée"]}
const nomCli=id=>(byId("clients",id)||{}).nom||"Client de passage";
const nomFour=id=>(byId("fournisseurs",id)||{}).nom||"—";

/* ---------- indicateurs financiers ---------- */
function fin(r){const V=ventesR(r);const ca=sum(V,netV);const cogs=sum(V,cogsV);
 const D=S.depenses.filter(x=>x.statut!=="annulee"&&inR(x.date,r));const charges=sum(D.filter(x=>x.imputation!=="lot"),x=>x.montant);
 const fixes=sum(D.filter(x=>x.imputation!=="lot"&&x.nature==="fixe"),x=>x.montant),variables=sum(D.filter(x=>x.imputation!=="lot"&&x.nature!=="fixe"),x=>x.montant);
 const depTot=sum(D,x=>x.montant);const achats=sum(S.achats.filter(x=>x.statut!=="annulee"&&inR(x.date,r)),x=>x.total);
 const enc=sum(S.operations.filter(o=>!o.annule&&o.sens==="in"&&String(o.ref).startsWith("ventes/")&&inR(o.date,r)),o=>o.montant);
 const dec=sum(S.operations.filter(o=>!o.annule&&o.sens==="out"&&!o.transfert&&inR(o.date,r)),o=>o.montant);
 const sachets=sum(V,qNet);
 return{ca,cogs,mb:ca-cogs,charges,fixes,variables,depTot,achats,res:ca-cogs-charges,enc,dec,sachets,nbV:V.length,
  tres:tresorerie(),stock:stockVal(),creances:sum(S.ventes,duV),dettes:sum(S.achats,duA)+sum(S.depenses,duD)}}
function delta(a,b){if(b===null||b===undefined)return "";if(!b)return a?`<span class="dl up">nouveau</span>`:"";const p=(a-b)/Math.abs(b)*100;return `<span class="dl ${p>=0?"up":"down"}">${p>=0?"▲":"▼"} ${Math.abs(p).toFixed(0)} %</span>`}

/* ---------- graphiques (SVG, survol) ---------- */
function buckets(r,type=PER.type){if(type==="tout"){const ds=[...S.ventes,...S.depenses].map(x=>String(x.date||"").slice(0,7)).filter(Boolean).sort();const a=ds[0]||today().slice(0,7),b=today().slice(0,7);const L=[];let d=new Date(a+"-01T12:00:00");while(d.toISOString().slice(0,7)<=b){const k=d.toISOString().slice(0,7);L.push({k,lab:d.toLocaleDateString("fr-FR",{month:"short",year:"2-digit"}),r:[k+"-01",k+"-31"]});d.setMonth(d.getMonth()+1)}return L}
 if(type==="trimestre"||type==="annee"){const L=[];let d=new Date(r[0]+"T12:00:00");while(d.toISOString().slice(0,10)<=r[1]){const k=d.toISOString().slice(0,7);L.push({k,lab:d.toLocaleDateString("fr-FR",{month:"short"}),r:[k+"-01",k+"-31"]});d.setMonth(d.getMonth()+1)}return L}
 const L=[];let d=r[0];while(d<=r[1]){L.push({k:d,lab:new Date(d+"T12:00:00").toLocaleDateString("fr-FR",type==="mois"?{day:"numeric"}:{weekday:"short",day:"numeric"}),r:[d,d]});d=addDays(d,1)}return L}
let CH=0;const CHD={};
function chart(kind,labels,series,opts={}){const id="ch"+(++CH);CHD[id]={labels,series,kind,fmt:opts.fmt||F};const W=760,H=opts.h||240,pl=64,pr=14,pt=14,pb=28;const iw=W-pl-pr,ih=H-pt-pb;
 const all=series.flatMap(s=>s.v);let mx=Math.max(0,...all),mn=Math.min(0,...all);if(mx===mn)mx=mn+1;const nice=x=>{const p=Math.pow(10,Math.floor(Math.log10(Math.abs(x)||1)));return Math.ceil(x/p)*p};mx=nice(mx);if(mn<0)mn=-nice(-mn);
 const Y=y=>pt+ih-(y-mn)/(mx-mn)*ih;const n=labels.length;const bw=iw/Math.max(1,n);const X=i=>pl+bw*i+bw/2;
 const tk=[0,1,2,3,4].map(i=>mn+(mx-mn)*i/4);let g=tk.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" class="cg"/><text x="${pl-8}" y="${Y(t)+4}" text-anchor="end" class="ct">${(opts.fmtTick||(x=>Math.abs(x)>=1e6?N(x/1e6)+" M":Math.abs(x)>=1e3?N(x/1e3)+" k":N(x)))(t)}</text>`).join("");
 const step=Math.ceil(n/12);g+=labels.map((l,i)=>i%step===0?`<text x="${X(i)}" y="${H-8}" text-anchor="middle" class="ct">${esc(l)}</text>`:"").join("");
 let m="";if(kind==="bar"){const k=series.length,gw=Math.min(bw*.72,k*26),w=gw/k;series.forEach((s,j)=>s.v.forEach((y,i)=>{const x0=X(i)-gw/2+j*w,y0=Y(Math.max(0,y)),h=Math.abs(Y(y)-Y(0));if(h>0)m+=`<rect x="${x0+1}" y="${y0}" width="${Math.max(1,w-2)}" height="${Math.max(1,h)}" rx="${Math.min(4,w/2)}" fill="${s.c}"/>`}))}
 else series.forEach(s=>{m+=`<path d="${s.v.map((y,i)=>(i?"L":"M")+X(i)+" "+Y(y)).join("")}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;if(n<=40)m+=s.v.map((y,i)=>`<circle cx="${X(i)}" cy="${Y(y)}" r="3" fill="${s.c}" stroke="var(--sf)" stroke-width="2"/>`).join("")});
 const zero=mn<0?`<line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--tx2)" stroke-width="1"/>`:"";
 const hit=labels.map((l,i)=>`<rect x="${pl+bw*i}" y="${pt}" width="${bw}" height="${ih}" fill="transparent" onmousemove="chTip(event,'${id}',${i})" ontouchstart="chTip(event,'${id}',${i})" onmouseleave="chOff()"/>`).join("");

function voirVente(id){const x=byId("ventes",id);if(!x)return;const ops=S.operations.filter(o=>o.ref==="ventes/"+id);const [c,l]=stPay(x);
 openM(`<div class="row"><h2 style="margin:0">Vente ${esc(x.num)}</h2>${pill(c,l)}<span class="sp"></span><button class="btn light sm" onclick="closeM()">Fermer</button></div>
