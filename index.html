 ${SEC("Paiements")}${ops.length?`<table>${ops.map(o=>`<tr class="${o.annule?"off":""}"><td>${dfr(o.date)}</td><td>${esc((byId("comptes",o.compte)||{}).nom||"")}</td><td class="n">${o.sens==="in"?"+":"−"} ${F(o.montant)}</td></tr>`).join("")}</table>`:`<div class="empty">Aucun paiement reçu.</div>`}
 ${x.statut!=="annulee"?`<div class="row" style="margin-top:16px">${duV(x)>0?`<button class="btn" onclick="encaisser('${id}')">Encaisser un paiement</button>`:""}<button class="btn light" onclick="retourVente('${id}')">Enregistrer un retour</button><button class="btn light" onclick="editVente('${id}')">Modifier</button><span class="sp"></span><button class="btn red" onclick="annulerVente('${id}')">Annuler la vente</button></div>`:""}
 ${(x.historique||[]).length?`<p class="muted" style="margin-top:12px">Modifiée ${x.historique.length} fois · dernière : ${dfr(x.historique.at(-1).date)}</p>`:""}`)}
function encaisser(id){const x=byId("ventes",id);openM(`<h2>Encaisser · ${esc(x.num)}</h2><div class="f"><label>Montant (FCFA)<input id="e_mt" type="number" value="${Math.round(duV(x))}"></label><label>Compte<select id="e_cpt">${cptOpts()}</select></label><label>Date<input id="e_date" type="date" value="${today()}"></label></div>
 <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn light" onclick="voirVente('${id}')">Retour</button><button class="btn" onclick="doEnc('${id}')">Enregistrer le paiement</button></div>`)}
async function doEnc(id){const x=byId("ventes",id);const m=num(v("e_mt"));if(m<=0||m>duV(x)+0.5){toast("Montant entre 1 et "+F(duV(x)));return}if(!v("e_cpt")){toast("Crée un compte de trésorerie");return}
 await guard(()=>addOp({date:v("e_date"),compte:v("e_cpt"),sens:"in",montant:m,type:"encaissement",ref:"ventes/"+id,libelle:"Vente "+x.num}),"Paiement enregistré");setTimeout(()=>voirVente(id),300)}
function retourVente(id){const x=byId("ventes",id);openM(`<h2>Retour · ${esc(x.num)}</h2><p class="note">Les sachets retournés reviennent dans le stock (sauf s'ils sont perdus) et le montant de la vente baisse d'autant.</p><div class="f"><label>Sachets retournés<input id="r_q" type="number" min="1" max="${qNet(x)}" value="1"></label><label>État<select id="r_etat"><option value="stock">Revendables : retour en stock</option><option value="perte">Abîmés : comptés en perte</option></select></label><label class="full">Motif<input id="r_mot"></label></div>
 <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn light" onclick="voirVente('${id}')">Retour</button><button class="btn" onclick="doRetour('${id}')">Enregistrer</button></div>`)}
async function doRetour(id){const x=byId("ventes",id);const q=num(v("r_q"));if(q<=0||q>qNet(x)){toast("Entre 1 et "+qNet(x));return}const it=finiOf(x.produitId);
 await guard(async()=>{await put("ventes",id,{retours:num(x.retours)+q,retoursPerte:num(x.retoursPerte)+(v("r_etat")==="perte"?q:0),historique:[...(x.historique||[]),{date:new Date().toISOString(),par:ME,retour:q,motif:v("r_mot")}]},`Retour de ${q} sachet(s) sur ${x.num}`);
  if(it&&v("r_etat")==="stock")await addMvt({itemId:it.id,type:"retour",qte:q,valeurUnitaire:x.coutUnitaire,source:"retour",ref:"ventes/"+id,motif:"Retour "+x.num+(v("r_mot")?" · "+v("r_mot"):"")});
  const trop=encV(x)-netV({...x,retours:num(x.retours)+q});if(trop>0.5)toast("Le client a payé "+F(trop)+" de trop : rembourse-le depuis la Trésorerie")},"Retour enregistré");setTimeout(()=>voirVente(id),300)}
function annulerVente(id){const x=byId("ventes",id);const e=encV(x);openM(`<h2>Annuler la vente ${esc(x.num)}</h2><p class="note">La vente reste visible (barrée) avec son motif : rien n'est effacé. Les sachets reviennent en stock.</p><div class="f"><label class="full">Motif de l'annulation<input id="an_m" placeholder="obligatoire"></label>
 ${e>0?`<label class="full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="an_rb" checked style="width:20px;height:20px"> Rembourser au client ${F(e)} déjà encaissés</label><label>Depuis le compte<select id="an_cpt">${cptOpts()}</select></label>`:""}</div>
 <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn light" onclick="voirVente('${id}')">Retour</button><button class="btn red" onclick="doAnnul('${id}')">Confirmer l'annulation</button></div>`)}
async function doAnnul(id){const x=byId("ventes",id);if(!v("an_m").trim()){toast("Indique le motif");return}
 await guard(async()=>{await put("ventes",id,{statut:"annulee",annuleLe:today(),annuleMotif:v("an_m"),annulePar:ME},`Vente ${x.num} annulée : ${v("an_m")}`);
  const it=finiOf(x.produitId);if(it&&qNet(x)>0)await addMvt({itemId:it.id,type:"retour",qte:qNet(x),valeurUnitaire:x.coutUnitaire,source:"annulation",ref:"ventes/"+id,motif:"Annulation "+x.num});
  const e=encV(x);if(e>0&&$("#an_rb")&&$("#an_rb").checked)await addOp({compte:v("an_cpt"),sens:"out",montant:e,type:"remboursement",ref:"ventes/"+id,libelle:"Remboursement "+x.num});closeM()},"Vente annulée")}

let FD={q:"",cat:""};
function depenses(){const r=range(PER.type,PER.ref);let L=S.depenses.filter(x=>inR(x.date,r));if(FD.cat)L=L.filter(x=>x.categorie===FD.cat);
 if(FD.q){const q=FD.q.toLowerCase();L=L.filter(x=>[x.intitule,x.beneficiaire,x.categorie,x.description].join(" ").toLowerCase().includes(q))}L.sort((a,b)=>String(b.date).localeCompare(String(a.date)));const A=L.filter(x=>x.statut!=="annulee");
 const parCat=CAT_DEP.map(c=>sum(A.filter(x=>x.categorie===c),x=>x.montant));
 return `<div class="row"><h2>Dépenses</h2><span class="sp"></span>${perBar()}<button class="btn" onclick="editDepense()">+ Nouvelle dépense</button></div>
 <div class="kpis">${kpi("Engagées",F(sum(A,x=>x.montant)),`${A.length} dépense(s)`)}${kpi("Payées",F(sum(A,payD)),"Décaissé")}${kpi("Reste à payer",F(sum(A,duD)),"Engagé non payé",sum(A,duD)>0?"warn":"")}${kpi("Charges fixes",F(sum(A.filter(x=>x.nature==="fixe"),x=>x.montant)),"Variables : "+F(sum(A.filter(x=>x.nature!=="fixe"),x=>x.montant)))}</div>
 <div class="filters"><input placeholder="Rechercher une dépense…" value="${esc(FD.q)}" data-keep="1" oninput="FD.q=this.value;clearTimeout(window._fq);window._fq=setTimeout(()=>{render();const e=document.querySelector('.filters input');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},250)"><select onchange="FD.cat=this.value;render()"><option value="">Toutes les catégories</option>${opt(CAT_DEP,FD.cat)}</select><button class="btn light" onclick="exportDepenses()">Exporter (Excel)</button></div>
 ${A.length?`<div class="card">${SEC("Par catégorie")}${chart("bar",CAT_DEP.map(c=>c.split(" ")[0]),[{n:"Dépenses",c:C2,v:parCat}],{h:200})}</div>`:""}
 ${L.length?`<div class="tw"><table><tr><th>Date</th><th>Intitulé</th><th>Catégorie</th><th>Bénéficiaire</th><th class="n">Montant</th><th class="n">Reste</th><th>Statut</th></tr>${L.map(x=>`<tr class="click ${x.statut==="annulee"?"off":""}" onclick="editDepense('${x.id}')"><td>${dfr(x.date)}</td><td><b>${esc(x.intitule)}</b>${x.justificatif?" 📎":""}<div class="muted">${esc((NATURES.find(n=>n[0]===x.nature)||[,""])[1])}${x.imputation==="lot"?" · incluse dans un lot":""}</div></td><td>${esc(x.categorie)}</td><td>${esc(x.beneficiaire||"")}</td><td class="n">${F(x.montant)}</td><td class="n">${F(duD(x))}</td><td>${x.statut==="annulee"?pill("st-annulee","Supprimée"):pill(...stD(duD(x),num(x.montant)))}</td></tr>`).join("")}</table></div>`:`<div class="empty">Aucune dépense sur cette période.</div>`}`}
let DJ="";
function editDepense(id){const x=byId("depenses",id)||{date:today(),categorie:"Autres",nature:"variable",imputation:"charge"};DJ=x.justificatif||"";const ops=id?S.operations.filter(o=>o.ref==="depenses/"+id):[];
 openM(`<h2>${id?"Dépense":"Nouvelle dépense"}</h2>${x.statut==="annulee"?`<div class="alert bad">Supprimée le ${dfr(x.annuleLe)} : ${esc(x.annuleMotif||"")}. Elle reste visible pour la traçabilité.</div>`:""}<div class="f">
 <label class="full">Intitulé<input id="d_int" value="${esc(x.intitule||"")}" placeholder="ex. Achat de sachets doypack"></label>
 <label>Montant (FCFA)<input id="d_mt" type="number" value="${esc(x.montant??"")}"></label>
 <label>Date<input id="d_date" type="date" value="${esc(x.date)}"></label>
 <label>Catégorie<select id="d_cat" onchange="dNat()">${opt(CAT_DEP,x.categorie)}</select></label>
 <label>Nature<select id="d_nat">${opt(NATURES,x.nature)}</select></label>
 <label>Activité<input id="d_act" value="${esc(x.activite||"Mateión Kilichi")}"></label>
 <label>Bénéficiaire<input id="d_ben" value="${esc(x.beneficiaire||"")}"></label>${typeof depExtra==="function"?depExtra(x):""}
 <label class="full">Imputation<select id="d_imp">${opt([["charge","Charge de la période (réduit le résultat)"],["lot","Déjà comptée dans le coût d'un lot de production (ne compte pas deux fois)"]],x.imputation)}</select></label>
 <label class="full">Description<textarea id="d_desc">${esc(x.description||"")}</textarea></label>
 <div class="full"><div class="ml">Justificatif (facture, reçu)</div><div class="row" id="d_jw">${djHTML()}</div></div>
 ${id?"":`<label>Payée maintenant (FCFA)<input id="d_pay" type="number" placeholder="0 si pas encore payée"></label><label>Depuis le compte<select id="d_cpt">${cptOpts()}</select></label>`}
 </div>${id?`${SEC("Paiements")}${ops.length?`<table>${ops.map(o=>`<tr class="${o.annule?"off":""}"><td>${dfr(o.date)}</td><td>${esc((byId("comptes",o.compte)||{}).nom||"")}</td><td class="n">${F(o.montant)}</td></tr>`).join("")}</table>`:`<div class="empty">Pas encore payée.</div>`}`:""}
 <div class="row" style="margin-top:16px">${id&&x.statut!=="annulee"?`<button class="btn red sm" onclick="suppr('depenses','${id}')">Supprimer</button>${duD(x)>0?`<button class="btn light sm" onclick="payer('depenses','${id}')">Payer</button>`:""}`:""}<span class="sp"></span><button class="btn light" onclick="closeM()">Fermer</button>${x.statut!=="annulee"?`<button class="btn" onclick="saveDepense('${id||""}')">Enregistrer</button>`:""}</div>`);if(!id)dNat()}
function djHTML(){return (DJ?`<a href="${img(DJ)}" target="_blank" rel="noopener" class="btn light sm">Voir le justificatif</a><button class="btn light sm" onclick="DJ='';$('#d_jw').innerHTML=djHTML()">Retirer</button>`:"")+(assets?`<label class="btn light sm" style="flex-direction:row">${DJ?"Remplacer":"+ Joindre"}<input type="file" accept="image/*,application/pdf" style="display:none" onchange="upJ(this)"></label>`:`<span class="muted">Ajout de fichiers réservé aux éditeurs.</span>`)}
async function upJ(inp){const f=inp.files[0];if(!f)return;try{toast("Envoi…");const r=await assets.upload(f);DJ=r.id;$("#d_jw").innerHTML=djHTML();toast("Justificatif joint")}catch(e){toast("Fichier refusé")}}
function dNat(){const c=v("d_cat");if(["Salaires","Électricité","Eau","Frais administratifs","Communication"].includes(c))$("#d_nat").value="fixe";else if(["Matières premières","Emballages","Étiquettes","Approvisionnement","Main-d'œuvre"].includes(c))$("#d_nat").value="production";else $("#d_nat").value="variable"}
async function saveDepense(id){const m=num(v("d_mt"));if(m<=0){toast("Indique un montant");return}if(!v("d_int").trim()){toast("Indique un intitulé");return}
 const d={...(typeof depExtraRead==="function"?depExtraRead():{}),intitule:v("d_int").trim(),montant:m,date:v("d_date")||today(),categorie:v("d_cat"),nature:v("d_nat"),activite:v("d_act"),beneficiaire:v("d_ben"),imputation:v("d_imp"),description:v("d_desc"),justificatif:DJ};
 await guard(async()=>{if(id){const x=byId("depenses",id);await put("depenses",id,{...d,historique:[...(x.historique||[]),{date:new Date().toISOString(),par:ME,avant:{montant:x.montant,intitule:x.intitule}}]},"Dépense modifiée : "+d.intitule)}
  else{const nid=await put("depenses",null,{...d,statut:"engagee"},"Dépense : "+d.intitule+" · "+F(m));const p=Math.min(m,num(v("d_pay")));if(p>0&&v("d_cpt"))await addOp({date:d.date,compte:v("d_cpt"),sens:"out",montant:p,type:"paiement",ref:"depenses/"+nid,libelle:d.intitule})}closeM()},"Dépense enregistrée")}
function payer(col,id){const x=byId(col,id);const du=col==="depenses"?duD(x):duA(x);openM(`<h2>Payer</h2><div class="f"><label>Montant (FCFA)<input id="p_mt" type="number" value="${Math.round(du)}"></label><label>Compte<select id="p_cpt">${cptOpts()}</select></label><label>Date<input id="p_date" type="date" value="${today()}"></label></div><div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn light" onclick="closeM()">Annuler</button><button class="btn" onclick="doPay('${col}','${id}')">Enregistrer le paiement</button></div>`)}
async function doPay(col,id){const x=byId(col,id);const du=col==="depenses"?duD(x):duA(x);const m=num(v("p_mt"));if(m<=0||m>du+0.5){toast("Montant entre 1 et "+F(du));return}if(!v("p_cpt")){toast("Crée un compte");return}
 await guard(async()=>{await addOp({date:v("p_date"),compte:v("p_cpt"),sens:"out",montant:m,type:"paiement",ref:col+"/"+id,libelle:col==="depenses"?x.intitule:"Achat "+(x.num||"")});closeM()},"Paiement enregistré")}
function suppr(col,id){openM(`<h2>Supprimer</h2><p class="note">L'opération ne sera pas effacée : elle sera marquée « supprimée », exclue des calculs, et restera visible avec son motif dans l'historique. Ses paiements seront annulés aussi.</p><div class="f"><label class="full">Motif<input id="s_m" placeholder="obligatoire"></label></div><div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn light" onclick="closeM()">Annuler</button><button class="btn red" onclick="doSuppr('${col}','${id}')">Confirmer</button></div>`)}
async function doSuppr(col,id){if(!v("s_m").trim()){toast("Indique le motif");return}
 await guard(async()=>{await put(col,id,{statut:"annulee",annuleLe:today(),annuleMotif:v("s_m"),annulePar:ME},`${col} supprimé(e) : ${v("s_m")}`);
  for(const o of S.operations.filter(o=>o.ref===col+"/"+id&&!o.annule))await db.collection("operations").doc(o.id).update({annule:true,annuleMotif:"opération liée supprimée"});
  for(const m of S.mouvements.filter(m=>m.ref===col+"/"+id&&!m.annule))await db.collection("mouvements").doc(m.id).update({annule:true,annuleMotif:"opération liée supprimée"});closeM()},"Marqué comme supprimé (traçabilité conservée)")}

let ASUB="achats";
function achats(){const r=range(PER.type,PER.ref);const L=S.achats.filter(x=>inR(x.date,r)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));const A=L.filter(x=>x.statut!=="annulee");
 const tabs=`<div class="seg" style="margin-bottom:14px">${[["achats","Achats"],["fournisseurs","Fournisseurs"],["prix","Comparer les prix"]].map(([k,l])=>`<button class="${ASUB===k?"on":""}" onclick="ASUB='${k}';render()">${l}</button>`).join("")}</div>`;
 let body="";
 if(ASUB==="achats")body=`<div class="kpis">${kpi("Achats",F(sum(A,x=>x.total)),`${A.length} achat(s)`)}${kpi("Payé",F(sum(A,payA)))}${kpi("Reste à payer",F(sum(A,duA)),"Dettes fournisseurs",sum(A,duA)>0?"warn":"")}</div>
 ${L.length?`<div class="tw"><table><tr><th>N°</th><th>Date</th><th>Fournisseur</th><th>Article</th><th class="n">Qté</th><th class="n">Prix unit.</th><th class="n">Total</th><th class="n">Reste</th><th>Échéance</th><th>Statut</th></tr>${L.map(x=>{const it=byId("stock",x.itemId)||{};return `<tr class="click ${x.statut==="annulee"?"off":""}" onclick="editAchat('${x.id}')"><td><b>${esc(x.num||"")}</b></td><td>${dfr(x.date)}</td><td>${esc(nomFour(x.fournisseurId))}</td><td>${esc(it.nom||"")}${x.recu?"":` ${pill("st-attente","Non reçu")}`}</td><td class="n">${N(x.qte)} ${esc(it.unite||"")}</td><td class="n">${F(x.pu)}</td><td class="n">${F(x.total)}</td><td class="n">${F(duA(x))}</td><td>${dfr(x.echeance)}</td><td>${x.statut==="annulee"?pill("st-annulee","Supprimé"):pill(...stD(duA(x),num(x.total)))}</td></tr>`}).join("")}</table></div>`:`<div class="empty">Aucun achat sur cette période.</div>`}`;
 else if(ASUB==="fournisseurs")body=S.fournisseurs.length?`<div class="tw"><table><tr><th>Fournisseur</th><th>Type</th><th>Produits fournis</th><th class="n">Achats</th><th class="n">Payé</th><th class="n">Reste</th><th>Conditions</th></tr>${S.fournisseurs.map(f=>{const L2=S.achats.filter(x=>x.fournisseurId===f.id&&x.statut!=="annulee");return `<tr class="click" onclick="editFour('${f.id}')"><td><b>${esc(f.nom)}</b><div class="muted">${esc(f.tel||"")} ${esc(f.adresse||"")}</div></td><td>${esc(f.type||"")}</td><td>${esc(f.produits||"")}</td><td class="n">${F(sum(L2,x=>x.total))}<div class="muted">${L2.length} achat(s)</div></td><td class="n">${F(sum(L2,payA))}</td><td class="n" style="${sum(L2,duA)>0?"color:var(--red)":""}">${F(sum(L2,duA))}</td><td>${esc(f.conditions||"")}</td></tr>`}).join("")}</table></div>`:`<div class="empty">Aucun fournisseur. Ajoute ceux qui te vendent le kilichi, les sachets et les étiquettes.</div>`;
 else{const items=S.stock.filter(i=>i.type!=="fini");body=items.map(i=>{const L2=S.achats.filter(x=>x.itemId===i.id&&x.statut!=="annulee");if(!L2.length)return "";const fs=[...new Set(L2.map(x=>x.fournisseurId))];
  const rows=fs.map(f=>{const Lf=L2.filter(x=>x.fournisseurId===f).sort((a,b)=>String(a.date).localeCompare(String(b.date)));const q=sum(Lf,x=>x.qte);return{f,last:Lf.at(-1),moy:q?sum(Lf,x=>x.total)/q:0,min:Math.min(...Lf.map(x=>num(x.pu))),n:Lf.length}}).sort((a,b)=>a.moy-b.moy);

async function saveAchat(id){const q=num(v("a_q")),pu=num(v("a_pu")),fr=num(v("a_fr"));if(q<=0||pu<0){toast("Quantité et prix requis");return}if(!v("a_item")){toast("Choisis l'article");return}

   const mv=S.mouvements.find(m=>m.ref==="achats/"+id&&!m.annule);if(mv&&(mv.qte!==q||mv.itemId!==d.itemId||Math.abs(mv.valeurUnitaire-total/q)>0.01||(mv.lot||"")!==d.lot||(mv.dlc||"")!==d.dlc||(d.emplacementId&&(mv.emplacementId||"__principal")!==d.emplacementId))){await db.collection("mouvements").doc(mv.id).update({annule:true,annuleMotif:"achat modifié"});await addMvt({date:d.date,itemId:d.itemId,type:"entree",qte:q,valeurUnitaire:total/q,source:"achat",ref:"achats/"+id,motif:"Achat "+(x.num||"")+" (modifié)",emplacementId:d.emplacementId,lot:d.lot,dlc:d.dlc})}
   if(recuNow)await addMvt({date:today(),itemId:d.itemId,type:"entree",qte:q,valeurUnitaire:total/q,source:"achat",ref:"achats/"+id,motif:"Réception achat "+(x.num||""),emplacementId:d.emplacementId,lot:d.lot,dlc:d.dlc})}
  else{const numero=nextNum("achats","A");const nid=await put("achats",null,{...d,num:numero,recu:$("#a_recu").checked,statut:"valide"},"Achat "+numero+" · "+F(total));
   if($("#a_recu").checked)await addMvt({date:d.date,itemId:d.itemId,type:"entree",qte:q,valeurUnitaire:total/q,source:"achat",ref:"achats/"+nid,motif:"Achat "+numero,emplacementId:d.emplacementId,lot:d.lot,dlc:d.dlc});
   const p=Math.min(total,num(v("a_pay")));if(p>0&&v("a_cpt"))await addOp({date:d.date,compte:v("a_cpt"),sens:"out",montant:p,type:"paiement",ref:"achats/"+nid,libelle:"Achat "+numero})}closeM()},"Achat enregistré")}

 openM(`<h2>Mouvement de stock</h2><p class="note">Chaque mouvement est tracé. Les ventes, achats et lots créent leurs mouvements tout seuls : ici, c'est pour le reste (pertes, ajustements, inventaire…).</p><div class="f">
 <label>Article<select id="m_item" onchange="mInfo()">${opt(items.map(i=>[i.id,i.nom]),itemId)}</select></label><label>Type<select id="m_type" onchange="mInfo()">${opt(TYPES_MVT,"perte")}</select></label>
 <label id="m_ql">Quantité<input id="m_q" type="number" step="0.01"></label><label>Valeur unitaire (entrées)<input id="m_vu" type="number"></label>

 <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn light" onclick="closeM()">Annuler</button><button class="btn" onclick="saveMvt()">Enregistrer</button></div>`);mInfo()}
function mInfo(){const t=v("m_type"),id=v("m_item");const i=byId("stock",id)||{};$("#m_ql").firstChild.textContent=t==="inventaire"?"Quantité comptée réellement":t==="ajustement"?"Quantité (+ ou −)":"Quantité";$("#m_info").innerHTML=`Stock actuel : <b>${N(qte(id))} ${esc(i.unite||"")}</b>${t==="inventaire"?" · l'écart sera enregistré comme correction":""}`}
async function saveMvt(){const t=v("m_type"),id=v("m_item");let q=num(v("m_q"));if(!v("m_mot").trim()){toast("Indique le motif");return}
 if(t==="inventaire")q=q-qte(id);else if(t==="sortie"||t==="perte")q=-Math.abs(q);else if(t==="entree"||t==="retour")q=Math.abs(q);if(!q){toast(t==="inventaire"?"Aucun écart avec le stock actuel":"Quantité requise");return}
 await guard(async()=>{await addMvt({date:v("m_date"),itemId:id,type:t,qte:q,valeurUnitaire:num(v("m_vu"))||(q>0?cu(id):0),source:"manuel",motif:v("m_mot")});closeM()},"Mouvement enregistré")}

/* ================= PRODUCTION & CONDITIONNEMENT ================= */
let PSUB="lots";
function production(){const r=range(PER.type,PER.ref);const L=S.lots.filter(l=>inR(l.date,r)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));const A=L.filter(l=>!l.annule);
 const tabs=`<div class="seg" style="margin-bottom:14px">${[["lots","Lots"],["recettes","Fiches techniques"]].map(([k,l])=>`<button class="${PSUB===k?"on":""}" onclick="PSUB='${k}';render()">${l}</button>`).join("")}</div>`;
 const body=PSUB==="lots"?`<div class="kpis">${kpi("Lots",A.length)}${kpi("Sachets conformes",N(sum(A,l=>l.sachets)))}${kpi("Pertes",N(sum(A,l=>l.pertes)),"Sachets non conformes")}${kpi("Coût moyen par sachet",sum(A,l=>l.sachets)?F(sum(A,l=>l.total)/sum(A,l=>l.sachets)):"—")}</div>
 ${L.length?`<div class="tw"><table><tr><th>Lot</th><th>Date</th><th>Produit</th><th class="n">Matière</th><th class="n">Sachets</th><th class="n">Pertes</th><th class="n">Coût total</th><th class="n">Coût / sachet</th><th>DLC</th></tr>${L.map(l=>`<tr class="click ${l.annule?"off":""}" onclick="voirLot('${l.id}')"><td><b>${esc(l.num)}</b></td><td>${dfr(l.date)}</td><td>${esc(nomProd(l.produitId))}</td><td class="n">${N(l.matiereQte)} ${esc((byId("stock",l.matiereId)||{}).unite||"")}</td><td class="n">${N(l.sachets)}</td><td class="n">${N(l.pertes)}</td><td class="n">${F(l.total)}</td><td class="n"><b>${F(l.unitaire)}</b></td><td>${dfr(l.dlc)}</td></tr>`).join("")}</table></div>`:`<div class="empty">Aucun lot sur cette période.</div>`}`
 :`<p class="note">Les fiches techniques enregistrent ta composition et les consommations théoriques par sachet. Aucune recette n'est imposée : remplis-les quand ta formulation est validée.</p>${S.recettes.length?`<div class="grid">${S.recettes.map(rc=>`<div class="card click" style="cursor:pointer" onclick="editRecette('${rc.id}')"><h3>${esc(nomProd(rc.produitId))}</h3><div class="muted" style="white-space:pre-wrap">${esc(rc.composition||"")}</div><table style="margin-top:8px">${(rc.conso||[]).map(c=>`<tr><td>${esc((byId("stock",c.itemId)||{}).nom||"")}</td><td class="n">${N(c.qte)} ${esc((byId("stock",c.itemId)||{}).unite||"")} / sachet</td></tr>`).join("")}</table></div>`).join("")}</div>`:`<div class="empty">Aucune fiche technique.</div>`}`;
 return `<div class="row"><h2>Production & conditionnement</h2><span class="sp"></span>${PSUB==="lots"?perBar():""}${PSUB==="lots"?`<button class="btn" onclick="editLot()">+ Nouveau lot</button>`:`<button class="btn" onclick="editRecette()">+ Fiche technique</button>`}</div>${tabs}${body}`}
function editLot(){const prods=S.produits.filter(p=>p.actif!==false);const mat=S.stock.filter(i=>!i.archive&&(i.type==="matiere"||i.type==="semi")),sac=S.stock.filter(i=>!i.archive&&(i.type==="sachet"||i.type==="emballage")),eti=S.stock.filter(i=>!i.archive&&i.type==="etiquette");
 if(!prods.length){toast("Crée d'abord un produit");return}
 openM(`<h2>Nouveau lot · ${nextNum("lots","L")}</h2><p class="note">Les quantités consommées sortent du stock à leur coût moyen ; les sachets conformes entrent en produits finis au coût unitaire du lot.</p><div class="f">
 <label>Date de production<input id="l_date" type="date" value="${today()}"></label><label>Produit et saveur<select id="l_prod" onchange="lCalc()">${opt(prods.map(p=>[p.id,nomProd(p.id)]))}</select></label>
 <label>Matière première<select id="l_mat" onchange="lCalc()"><option value="">— aucune —</option>${opt(mat.map(i=>[i.id,i.nom+" ("+N(qte(i.id))+" "+(i.unite||"")+" dispo)"]))}</select></label><label>Quantité utilisée<input id="l_mq" type="number" step="0.001" oninput="lCalc()"></label>
 <label>Sachets (emballage)<select id="l_sac" onchange="lCalc()"><option value="">— aucun —</option>${opt(sac.map(i=>[i.id,i.nom+" ("+N(qte(i.id))+" dispo)"]))}</select></label><label>Étiquettes<select id="l_eti" onchange="lCalc()"><option value="">— aucune —</option>${opt(eti.map(i=>[i.id,i.nom+" ("+N(qte(i.id))+" dispo)"]))}</select></label>
 <label>Sachets conformes obtenus<input id="l_ok" type="number" oninput="lCalc()"></label><label>Sachets perdus / non conformes<input id="l_ko" type="number" value="0" oninput="lCalc()"></label>
 <label>Main-d'œuvre (FCFA)<input id="l_mo" type="number" value="0" oninput="lCalc()"></label><label>Autres coûts directs (FCFA)<input id="l_aut" type="number" value="0" oninput="lCalc()"></label>
 <label>Date limite de consommation<input id="l_dlc" type="date"></label><label>Notes<input id="l_notes"></label>
 <label class="full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="l_dep" style="width:20px;height:20px"> La main-d'œuvre et les autres coûts sont payés maintenant : créer la dépense correspondante (comptée dans le lot, pas en double)</label>
 <label>Depuis le compte<select id="l_cpt">${cptOpts()}</select></label>
 <div class="full calc" id="l_calc"></div></div>
 <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn light" onclick="closeM()">Annuler</button><button class="btn" onclick="saveLot()">Enregistrer le lot</button></div>`,true);lCalc()}
function lCalc(){const ok=num(v("l_ok")),ko=num(v("l_ko")),n=ok+ko;const cm=num(v("l_mq"))*(v("l_mat")?cu(v("l_mat")):0),ce=n*((v("l_sac")?cu(v("l_sac")):0)+(v("l_eti")?cu(v("l_eti")):0));const mo=num(v("l_mo")),au=num(v("l_aut"));const t=cm+ce+mo+au;
 const rc=S.recettes.find(r=>r.produitId===v("l_prod"));const th=rc&&(rc.conso||[]).length&&ok?`<br>Consommation théorique (fiche technique) pour ${N(n)} sachets : ${rc.conso.map(c=>`${esc((byId("stock",c.itemId)||{}).nom||"")} ${N(c.qte*n)}`).join(" · ")}`:"";
 const mi=byId("stock",v("l_mat"));const warn=mi&&num(v("l_mq"))>qte(mi.id)?`<br><span style="color:var(--red)">Quantité supérieure au stock de matière disponible.</span>`:"";
 $("#l_calc").innerHTML=`Matières : <b>${F(cm)}</b> · emballages : <b>${F(ce)}</b> · main-d'œuvre : <b>${F(mo)}</b> · autres : <b>${F(au)}</b><br>Coût total du lot : <b>${F(t)}</b> · coût par sachet conforme : <b>${ok?F(t/ok):"—"}</b>${n&&ko?` · taux de perte ${(ko/n*100).toFixed(1)} %`:""}${th}${warn}`}
async function saveLot(){const ok=num(v("l_ok")),ko=num(v("l_ko"));if(ok<=0){toast("Indique les sachets conformes obtenus");return}
 const n=ok+ko,mat=v("l_mat"),sac=v("l_sac"),eti=v("l_eti");const cm=num(v("l_mq"))*(mat?cu(mat):0),ce=n*((sac?cu(sac):0)+(eti?cu(eti):0)),mo=num(v("l_mo")),au=num(v("l_aut")),t=cm+ce+mo+au;const date=v("l_date")||today();const numero=nextNum("lots","L");const it=finiOf(v("l_prod"));
 await guard(async()=>{const lid=await put("lots",null,{num:numero,date,produitId:v("l_prod"),matiereId:mat,matiereQte:num(v("l_mq")),sachetId:sac,etiquetteId:eti,sachets:ok,pertes:ko,coutMatiere:cm,coutEmballage:ce,coutMO:mo,autres:au,total:t,unitaire:t/ok,dlc:v("l_dlc"),notes:v("l_notes")},"Lot "+numero+" · "+ok+" sachets · "+F(t/ok)+"/sachet");
  const ref="lots/"+lid;if(mat&&num(v("l_mq")))await addMvt({date,itemId:mat,type:"sortie",qte:-num(v("l_mq")),valeurUnitaire:cu(mat),source:"production",ref,motif:"Lot "+numero});
  if(sac)await addMvt({date,itemId:sac,type:"sortie",qte:-n,valeurUnitaire:cu(sac),source:"production",ref,motif:"Lot "+numero});if(eti)await addMvt({date,itemId:eti,type:"sortie",qte:-n,valeurUnitaire:cu(eti),source:"production",ref,motif:"Lot "+numero});
  if(it)await addMvt({date,itemId:it.id,type:"entree",qte:ok,valeurUnitaire:t/ok,source:"production",ref,motif:"Lot "+numero});
  if($("#l_dep").checked&&mo+au>0){const did=await put("depenses",null,{intitule:"Main-d'œuvre et frais · lot "+numero,montant:mo+au,date,categorie:"Main-d'œuvre",nature:"production",imputation:"lot",activite:"Mateión Kilichi",statut:"engagee",description:"Créée avec le lot "+numero,lotRef:ref},"Dépense du lot "+numero);if(v("l_cpt"))await addOp({date,compte:v("l_cpt"),sens:"out",montant:mo+au,type:"paiement",ref:"depenses/"+did,libelle:"Lot "+numero})}
  closeM()},"Lot enregistré : "+ok+" sachets en stock")}
function voirLot(id){const l=byId("lots",id);openM(`<div class="row"><h2 style="margin:0">Lot ${esc(l.num)}</h2>${l.annule?pill("st-annulee","Annulé"):""}<span class="sp"></span><button class="btn light sm" onclick="closeM()">Fermer</button></div>
 <div class="kpis" style="margin-top:14px">${kpi("Sachets conformes",N(l.sachets),N(l.pertes)+" perdu(s)")}${kpi("Coût total",F(l.total))}${kpi("Coût par sachet",F(l.unitaire))}</div>
 <table><tr><td>Produit</td><td>${esc(nomProd(l.produitId))}</td></tr><tr><td>Date</td><td>${dfr(l.date)}</td></tr><tr><td>Matière</td><td>${N(l.matiereQte)} ${esc((byId("stock",l.matiereId)||{}).nom||"")} · ${F(l.coutMatiere)}</td></tr><tr><td>Emballages</td><td>${F(l.coutEmballage)}</td></tr><tr><td>Main-d'œuvre</td><td>${F(l.coutMO)}</td></tr><tr><td>Autres coûts</td><td>${F(l.autres)}</td></tr><tr><td>DLC</td><td>${dfr(l.dlc)||"—"}</td></tr>${l.notes?`<tr><td>Notes</td><td>${esc(l.notes)}</td></tr>`:""}</table>
 ${l.annule?"":`<div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn red" onclick="annLot('${id}')">Annuler ce lot</button></div>`}`)}
async function annLot(id){const l=byId("lots",id);const itL=finiOf(l.produitId);
 if(itL&&qte(itL.id)<num(l.sachets)-0.0001){toast("Annulation impossible : seules "+N(qte(itL.id))+" unité(s) restent en stock alors que le lot en a produit "+N(l.sachets)+". Enregistre d'abord les retours ou ajustements.");return}
 if(!confirmOnce("annLot"+id,"Clique encore pour confirmer l'annulation du lot "+l.num))return;
 await guard(async()=>{await put("lots",id,{annule:true,annuleLe:today()},"Lot "+l.num+" annulé");
  for(const d of S.depenses.filter(d=>d.statut!=="annulee"&&(d.lotRef==="lots/"+id||(d.imputation==="lot"&&d.description==="Créée avec le lot "+l.num)))){await put("depenses",d.id,{statut:"annulee",annuleLe:today(),annuleMotif:"lot "+l.num+" annulé",annulePar:ME},"Dépense du lot "+l.num+" annulée");for(const o of S.operations.filter(o=>o.ref==="depenses/"+d.id&&!o.annule))await db.collection("operations").doc(o.id).update({annule:true,annuleMotif:"lot annulé"})}for(const m of S.mouvements.filter(m=>m.ref==="lots/"+id&&!m.annule))await db.collection("mouvements").doc(m.id).update({annule:true,annuleMotif:"lot annulé"});closeM()},"Lot annulé, stocks rétablis")}
const CONF={};function confirmOnce(k,msg){if(CONF[k]&&Date.now()-CONF[k]<5000)return true;CONF[k]=Date.now();toast(msg);return false}
let RC=[];
function editRecette(id){const r=byId("recettes",id)||{conso:[]};RC=JSON.parse(JSON.stringify(r.conso||[]));openM(`<h2>Fiche technique</h2><div class="f">
 <label class="full">Produit<select id="r_prod">${opt(S.produits.map(p=>[p.id,nomProd(p.id)]),r.produitId)}</select></label>
 <label class="full">Composition, étapes, assaisonnement<textarea id="r_comp" style="min-height:120px">${esc(r.composition||"")}</textarea></label></div>
 ${SEC("Consommations théoriques par sachet")}<div id="rcw">${rcHTML()}</div><button class="btn light sm" onclick="RC.push({itemId:(S.stock[0]||{}).id,qte:0});$('#rcw').innerHTML=rcHTML()">+ Ligne</button>
 <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn light" onclick="closeM()">Fermer</button><button class="btn" onclick="saveRecette('${id||""}')">Enregistrer</button></div>`)}
function rcHTML(){return RC.map((c,i)=>`<div class="row" style="margin-bottom:6px"><select onchange="RC[${i}].itemId=this.value" style="flex:1">${opt(S.stock.filter(s=>s.type!=="fini").map(s=>[s.id,s.nom]),c.itemId)}</select><input type="number" step="0.0001" value="${esc(c.qte)}" oninput="RC[${i}].qte=+this.value" style="width:120px" placeholder="par sachet"><button class="btn light sm" onclick="RC.splice(${i},1);$('#rcw').innerHTML=rcHTML()">×</button></div>`).join("")}
async function saveRecette(id){await guard(async()=>{await put("recettes",id,{produitId:v("r_prod"),composition:v("r_comp"),conso:RC.filter(c=>c.itemId)},"Fiche technique "+nomProd(v("r_prod")));closeM()},"Fiche enregistrée")}

/* ================= CLIENTS ================= */
function cliStats(c){const V=S.ventes.filter(x=>x.clientId===c.id&&x.statut!=="annulee").sort((a,b)=>String(a.date).localeCompare(String(b.date)));return{V,n:V.length,ca:sum(V,netV),du:sum(V,duV),first:(V[0]||{}).date,last:(V.at(-1)||{}).date}}
function clients(){const r=range(PER.type,PER.ref);const L=S.clients.map(c=>({c,...cliStats(c)}));const nouveaux=L.filter(x=>x.first&&inR(x.first,r)).length,recurrents=L.filter(x=>x.V.filter(v2=>inR(v2.date,r)).length&&x.first&&!inR(x.first,r)).length;
 const top=[...L].sort((a,b)=>b.ca-a.ca).slice(0,5);
 return `<div class="row"><h2>Clients</h2><span class="sp"></span>${perBar()}<button class="btn" onclick="editClient()">+ Nouveau client</button></div>
 <div class="kpis">${kpi("Clients",L.length)}${kpi("Nouveaux clients",nouveaux,"Première commande sur la période")}${kpi("Clients récurrents",recurrents,"Déjà clients, revenus sur la période")}${kpi("Reste dû par les clients",F(sum(L,x=>x.du)),"",sum(L,x=>x.du)>0?"warn":"")}</div>
 ${top.some(x=>x.ca)?`<div class="card">${SEC("Meilleurs clients")}<table>${top.filter(x=>x.ca).map((x,i)=>`<tr class="click" onclick="editClient('${x.c.id}')"><td><b>${i+1}. ${esc(x.c.nom)}</b><div class="muted">${esc(x.c.type||"")}</div></td><td class="n">${F(x.ca)}</td><td class="n">${x.n} achat(s)</td></tr>`).join("")}</table></div>`:""}
 ${L.length?`<div class="tw"><table><tr><th>Client</th><th>Type</th><th>Localisation</th><th>Première commande</th><th>Dernière commande</th><th class="n">Achats</th><th class="n">Total</th><th class="n">Reste dû</th></tr>${L.sort((a,b)=>b.ca-a.ca).map(x=>`<tr class="click" onclick="editClient('${x.c.id}')"><td><b>${esc(x.c.nom)}</b><div class="muted">${esc(x.c.tel||"")}</div></td><td>${esc(x.c.type||"")}</td><td>${esc(x.c.localisation||"")}</td><td>${dfr(x.first)||"—"}</td><td>${dfr(x.last)||"—"}</td><td class="n">${x.n}</td><td class="n">${F(x.ca)}</td><td class="n" style="${x.du>0?"color:var(--red)":""}">${F(x.du)}</td></tr>`).join("")}</table></div>`:`<div class="empty">Aucun client. Ils se créent aussi automatiquement à chaque vente.</div>`}`}
function editClient(id){const c=byId("clients",id)||{type:"Particulier"};const st=id?cliStats(c):null;
 openM(`<h2>${id?esc(c.nom):"Nouveau client"}</h2><div class="f"><label>Nom<input id="c_nom" value="${esc(c.nom||"")}"></label><label>Téléphone<input id="c_tel" value="${esc(c.tel||"")}"></label>
 <label>Localisation<input id="c_loc" value="${esc(c.localisation||"")}"></label><label>Type<select id="c_type">${opt(TYPES_CLI,c.type)}</select></label>${typeof cliExtra==="function"?cliExtra(c):""}<label class="full">Notes<textarea id="c_notes">${esc(c.notes||"")}</textarea></label></div>
 ${st?`${SEC("Historique des achats")}${st.V.length?`<table>${[...st.V].reverse().map(x=>`<tr class="click" onclick="voirVente('${x.id}')"><td>${esc(x.num)}<div class="muted">${dfr(x.date)}</div></td><td>${esc(nomProd(x.produitId))} × ${N(qNet(x))}</td><td class="n">${F(netV(x))}</td><td>${pill(...stPay(x))}</td></tr>`).join("")}</table>`:`<div class="empty">Aucun achat.</div>`}`:""}
 <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn light" onclick="closeM()">Fermer</button><button class="btn" onclick="saveClient('${id||""}')">Enregistrer</button></div>`)}
async function saveClient(id){if(!v("c_nom").trim()){toast("Indique le nom");return}await guard(async()=>{await put("clients",id,{...(typeof cliExtraRead==="function"?cliExtraRead():{}),nom:v("c_nom").trim(),tel:v("c_tel"),localisation:v("c_loc"),type:v("c_type"),notes:v("c_notes")},"Client : "+v("c_nom"));closeM()},"Client enregistré")}

function tresorerieTab(){const r=range(PER.type,PER.ref);const O=S.operations.filter(o=>inR(o.date,r)).sort((a,b)=>String(b.date+(b.cree||"")).localeCompare(String(a.date+(a.cree||""))));const A=O.filter(o=>!o.annule&&!o.transfert);

function echeances(){const t=today(),s7=addDays(t,7);const etat=e=>!e?"":e<t?"retard":e<=s7?"proche":"avenir";const L=[];
 S.ventes.filter(x=>duV(x)>0).forEach(x=>L.push({sens:"in",qui:nomCli(x.clientId),doc:x.num,ini:netV(x),paye:encV(x),du:duV(x),ech:x.echeance,etat:etat(x.echeance),open:`voirVente('${x.id}')`}));
 S.achats.filter(x=>duA(x)>0).forEach(x=>L.push({sens:"out",qui:nomFour(x.fournisseurId),doc:x.num+(x.factureNum?" · fact. "+x.factureNum:""),ini:num(x.total),paye:payA(x),du:duA(x),ech:x.echeance,etat:etat(x.echeance),open:`editAchat('${x.id}')`}));
 S.depenses.filter(x=>duD(x)>0).forEach(x=>L.push({sens:"out",qui:x.beneficiaire||x.intitule,doc:x.intitule,ini:num(x.montant),paye:payD(x),du:duD(x),ech:x.echeance||x.date,etat:etat(x.echeance||x.date),open:`editDepense('${x.id}')`}));
 return L.sort((a,b)=>String(a.ech||"9").localeCompare(String(b.ech||"9")))}

 const tb=(L,t)=>L.length?`<div class="tw"><table><tr><th>${t}</th><th>Document</th><th class="n">Montant initial</th><th class="n">Payé</th><th class="n">Solde</th><th>Échéance</th><th>Statut</th></tr>${L.map(e=>`<tr class="click" onclick="${e.open}"><td><b>${esc(e.qui)}</b></td><td>${esc(e.doc)}</td><td class="n">${F(e.ini)}</td><td class="n">${F(e.paye)}</td><td class="n"><b>${F(e.du)}</b></td><td>${dfr(e.ech)||"—"}</td><td>${pill(...lab[e.etat])}</td></tr>`).join("")}</table></div>`:`<div class="empty">Rien en attente.</div>`;

 <p class="note">Les supermarchés paient souvent à environ ${P("delaiSupermarche",90)} jours : leurs ventes reçoivent automatiquement cette échéance (modifiable dans Paramètres et sur chaque vente).</p>
 ${SEC("À recevoir des clients")}${tb(C,"Client")}${SEC("À payer")}${tb(D,"Fournisseur / bénéficiaire")}`}

 const D=S.depenses.filter(z=>inR(z.date,r));const dep=["Dépenses",["Date","Intitulé","Catégorie","Nature","Bénéficiaire","Montant","Payé","Reste","Statut"],D.map(z=>[z.date,z.intitule,z.categorie,(NATURES.find(n=>n[0]===z.nature)||[,""])[1],z.beneficiaire||"",num(z.montant),payD(z),duD(z),z.statut==="annulee"?"Supprimée":stD(duD(z),num(z.montant))[1]]),[5,6,7]];

 const ach=["Achats",["N°","Date","Fournisseur","Article","Qté","Prix unitaire","Total","Payé","Reste"],S.achats.filter(z=>inR(z.date,r)&&z.statut!=="annulee").map(z=>[z.num,z.date,nomFour(z.fournisseurId),(byId("stock",z.itemId)||{}).nom||"",z.qte,num(z.pu),num(z.total),payA(z),duA(z)]),[5,6,7,8]];

 const ops=["Mouvements de trésorerie",["Date","Compte","Libellé","Type","Entrée","Sortie"],S.operations.filter(o=>!o.annule&&inR(o.date,r)).map(o=>[o.date,(byId("comptes",o.compte)||{}).nom||"",o.libelle||"",o.transfert?"Transfert":o.type,o.sens==="in"?num(o.montant):"",o.sens==="out"?num(o.montant):""]),[4,5]];
 const map={journalier:[syn,ven,dep],hebdomadaire:[syn,parProd,parCanal,ven,dep],mensuel:[syn,parProd,parCanal,depCat,ven,dep,ach],annuel:[syn,parProd,parCanal,depCat,lots],ventes:[parProd,parCanal,ven],depenses:[depCat,dep],achats:[ach],production:[lots],stock:[stk],tresorerie:[tre,ops],rentabilite:[syn,parProd],marques:(typeof repMarques==="function"?repMarques(r):[])};
 return{titre:rt[1],r,type,tables:map[RT],x}}

function loadJs(src){return new Promise((ok,ko)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function saveFile(name,blob){const dl=await claude.use("downloads").catch(()=>null);if(dl){try{await dl.save({filename:name,data:blob});toast("Fichier prêt : "+name);return}catch(e){if(e&&e.code==="declined")return}}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Téléchargé : "+name)}
async function xlsx(sheets,name){try{await loadJs("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");const wb=XLSX.utils.book_new();sheets.forEach(([t,h,rows])=>{const ws=XLSX.utils.aoa_to_sheet([h,...rows]);ws["!cols"]=h.map(()=>({wch:18}));XLSX.utils.book_append_sheet(wb,ws,t.replace(/[\\\/?*\[\]:]/g,"").slice(0,31)||"Feuille")});
 const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});await saveFile(name,new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}))}catch(e){toast("Export Excel impossible ici")}}

 if(fmt==="xlsx")return xlsx(d.tables,nm+".xlsx");
 try{await loadJs("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");await loadJs("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js");
  const doc=new window.jspdf.jsPDF({orientation:"landscape",unit:"pt",format:"a4"});const nm2=S.param.entreprise||"MATEIÓN";
  doc.setFont("helvetica","bold");doc.setFontSize(20);doc.text(nm2+" · Mateión Kilichi",40,46);doc.setFontSize(12);doc.setFont("helvetica","normal");doc.text(`${d.titre} · ${perLabel(d.type,d.r)} · édité le ${dfr(today())}`,40,66);
  let y=86;const pf=c=>typeof c==="number"?c.toLocaleString("fr-FR").replace(/[  ]/g," "):String(c);
  for(const [t,h,rows,money] of d.tables){doc.setFont("helvetica","bold");doc.setFontSize(12);if(y>520){doc.addPage();y=46}doc.text(t,40,y);
   doc.autoTable({startY:y+8,head:[h],body:rows.length?rows.map(rw=>rw.map((c,i)=>(money||[]).includes(i)&&typeof c==="number"?pf(Math.round(c))+" FCFA":/^\d{4}-\d{2}-\d{2}$/.test(c)?dfr(c):pf(c))):[["Aucune donnée"]],styles:{fontSize:8.5,cellPadding:4},headStyles:{fillColor:[22,25,28]},alternateRowStyles:{fillColor:[240,244,246]},margin:{left:40,right:40}});y=doc.lastAutoTable.finalY+28}
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120);doc.text(`${nm2} · Le goût qui marque · page ${i}/${n}`,40,575)}
  await saveFile(nm+".pdf",doc.output("blob"))}catch(e){toast("Export PDF impossible ici")}}

const GAMME=[{k:"np",sav:"Non pimenté",poids:50,img:"e50n",fmt:"Étui carton noir · 50 g"},{k:"p",sav:"Pimenté",poids:50,img:"e50p",fmt:"Étui carton bordeaux · 50 g"}];
function saveurKind(p){const s=((p&&p.saveur)||"").toLowerCase();if(!s)return "";if(s.includes("non"))return "np";return s.includes("piment")?"p":""}
function packImg(p){const k=saveurKind(p);if(!k)return "";return (k==="p"?IMGS.e50p:IMGS.e50n)}
function descPack(k){return `Bœuf séché aux épices, ${k==="p"?"pimenté":"non pimenté"}. Ingrédients : ${k==="p"?BR("ingredientsP"):BR("ingredientsNP")} ${BR("conservation")} Halal · Made in Cameroon.`}
function autoDesc(){const t=$("#p_desc");if(t&&!t.value.trim()){const k=saveurKind({saveur:v("p_sav")});if(k)t.value=descPack(k)}}

/* ---------- vitrine du tableau de bord ---------- */
function vitrine(r){const V=ventesR(r);let np=0,pp=0;V.forEach(z=>{const k=saveurKind(byId("produits",z.produitId));const q=qNet(z);if(k==="p")pp+=q;else if(k==="np")np+=q});const t=np+pp;const pos=t?pp/t*100:50;
 return `<div class="vit card"><div class="vsm"><i></i><i></i><i></i></div><div class="packs">${[["e50n","50 g · non pimenté"],["e50p","50 g · pimenté"]].map(([k,l],j)=>`<figure class="pk" style="--j:${j}"><img src="${IMGS[k]}" alt="Kilichi ${l}"></figure>`).join("")}</div>
 <div class="heat"><div class="hl"><span>Non pimenté</span><span>Pimenté</span></div><div class="hb"><div class="rm" style="--p:${pos.toFixed(1)}%" title="${t?Math.round(pos)+" % de pimenté vendu":"Aucune vente"}">${RUNNER}</div></div>
 <div class="hn">${t?`Ventes de la période : <b>${N(np)}</b> sachet(s) non pimenté(s) · <b>${N(pp)}</b> pimenté(s), soit <b>${Math.round(pos)} %</b> de pimenté.`:`Aucune vente sur la période : le coureur se placera selon la part réelle de pimenté vendue.`}</div></div></div>`}

/* ---------- gamme du packaging ---------- */
function gamme(){const R=GAMME.map((g,i)=>{const ex=S.produits.find(p=>saveurKind(p)===g.k&&num(p.poids)===g.poids);
  return `<tr><td style="width:56px"><img class="gth" src="${IMGS[g.img]}" alt=""></td><td><b>Mateión Kilichi · ${g.sav} · ${g.poids} g</b><div class="muted">${g.fmt}</div></td><td class="n">${ex?pill("st-livree","Déjà créé"):`<input id="g_${i}" type="number" min="0" placeholder="Prix FCFA" style="max-width:130px">`}</td></tr>`}).join("");
 openM(`<h2>Gamme du packaging</h2><p class="note">Les 4 références visibles sur tes emballages. Saisis le <b>prix de vente réel</b> de celles que tu vends : seules les lignes avec un prix seront créées. Ingrédients et conservation sont repris du packaging ; le stock de chaque référence se crée vide.</p><table>${R}</table>
 <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn light" onclick="closeM()">Fermer</button><button class="btn" onclick="saveGamme()">Créer les fiches</button></div>`)}
async function saveGamme(){const todo=[];GAMME.forEach((g,i)=>{const el=$("#g_"+i);if(el&&num(el.value)>0)todo.push({g,p:num(el.value)})});if(!todo.length){toast("Saisis au moins un prix");return}
 await guard(async()=>{for(const {g,p} of todo){const d={nom:"Mateión Kilichi",saveur:g.sav,sku:"MK-"+(g.k==="p"?"PIME":"NONP")+"-"+g.poids,poids:g.poids,prix:p,coutManuel:"",seuil:20,actif:true,description:descPack(g.k),photo:"",ean:""};
  const pid=await put("produits",null,d,"Produit : "+d.nom+" "+d.saveur+" "+d.poids+" g");const nm=`${d.nom} · ${d.saveur} · ${d.poids} g`;await put("stock",null,{nom:nm,type:"fini",unite:"sachet",produitId:pid,seuil:20},"Article de stock créé : "+nm)}closeM()},todo.length+" produit(s) créé(s)")}

   MATEIÓN BUSINESS OS · Phase 1
   Catalogue universel (produits, variantes, catégories dynamiques),
   marques & gammes, migration versionnée, contrôle d'intégrité.

   put(), guard(), log(), openM(), render(), S, db, assets, user.

/* ---------- accès au modèle ---------- */
const modeleOf = (pid) => { const p = byId("produits", pid); return p && p.modeleId ? byId("modeles", p.modeleId) : null; };
function uniteOf(pid) { const m = modeleOf(pid); if (m && m.unite) return m.unite; const it = S.stock.find((i) => i.produitId === pid); return (it && it.unite) || "unité"; }
const marqueOfProduit = (pid) => (modeleOf(pid) || {}).marqueId || "";
const variantesOf = (mid) => S.produits.filter((p) => p.modeleId === mid);
const nomMarque = (id) => (byId("marques", id) || {}).nom || "Sans marque";
const nomGamme = (id) => (byId("gammes", id) || {}).nom || "Sans gamme";
const orphelins = () => S.produits.filter((p) => !p.modeleId);
const needsMigration = () => SCHEMA.version !== 0 && orphelins().length > 0;
const canAdmin = () => { try { return !user || !user.canEdit || user.canEdit() !== false; } catch (e) { return true; } };
function stockOfProduit(pid) { return S.stock.find((i) => i.produitId === pid && !i.archive); }
function logoHTML(m, cls) { const src = m.logo ? img(m.logo) : m.logoBuiltin && typeof IMGS !== "undefined" ? IMGS.logo : ""; return src ? `<img class="${cls || ""}" src="${src}" alt="">` : `<span class="ini">${esc((m.nom || "?").slice(0, 1).toUpperCase())}</span>`; }

function catOptions(sel, excludeId) {
  const ex = excludeId ? [excludeId, ...MT.descendants(excludeId, S.categories)] : [];
  return S.categories.filter((c) => (!c.archive || c.id === sel) && !ex.includes(c.id)).map((c) => [c.id, MT.categoryPath(c.id, S.categories)]).sort((a, b) => a[1].localeCompare(b[1]));
}
/* Attend que la base ait renvoyé un état vérifiant `ok` (les écritures arrivent par onSnapshot). */
async function waitFor(ok, ms = 8000) { const t0 = Date.now(); while (!ok()) { if (Date.now() - t0 > ms) return false; await new Promise((r) => setTimeout(r, 100)); } return true; }

/* ================= PRODUITS : CATALOGUE ================= */
const LEGACY_produits = produits;
let PRSUB = "catalogue";

produits = function () {
  const orph = orphelins();
  const sub = `<div class="ptabs">${[["catalogue", "Catalogue"], ["references", "Références (SKU)"], ["categories", "Catégories"]].map(([k, l]) => `<button class="${PRSUB === k ? "on" : ""}" onclick="PRSUB='${k}';render()">${l}</button>`).join("")}</div>`;
  const migr = orph.length ? `<div class="alert bad"><b>${orph.length} fiche(s) produit de l'ancienne version</b> ne sont pas encore rattachées au catalogue universel (marques, gammes, variantes). ${canAdmin() ? `<a class="lk" onclick="openMigration()">Lancer la mise à niveau sécurisée</a>` : "Un éditeur doit lancer la mise à niveau."}</div>` : "";
  const head = `<div class="row"><h2>Produits</h2><span class="sp"></span>${PRSUB === "categories" ? `<button class="btn" onclick="editCategorie()">+ Catégorie</button>` : `<button class="btn light" onclick="gamme()">Gamme du packaging</button><button class="btn" onclick="editModele()">+ Nouveau produit</button>`}</div>`;
  let body = "";

  else if (PRSUB === "references") body = referencesView();
  else body = catalogueView();
  let legacy = "";
  if (orph.length && PRSUB === "catalogue") { const all = S.produits; S.produits = orph; try { legacy = LEGACY_produits().replace(/^[\s\S]*?<\/p>/, ""); } finally { S.produits = all; } }
  return head + migr + sub + body + (legacy ? SEC("Fiches de l'ancienne version (non rattachées)") + legacy : "");
};
function filtreModeles() {
  let L = S.modeles.slice();
  if (PF.statut) L = L.filter((m) => (PF.statut === "actif" ? m.statut !== "archive" && m.statut !== "inactif" : (m.statut || "actif") === PF.statut));
  if (PF.type) L = L.filter((m) => m.typeProduit === PF.type);
  if (PF.cat) { const ok = [PF.cat, ...MT.descendants(PF.cat, S.categories)]; L = L.filter((m) => ok.includes(m.categorieId)); }

  if (PF.gamme) L = L.filter((m) => m.gammeId === PF.gamme);
  if (PF.q) { const q = MT.norm(PF.q); L = L.filter((m) => MT.norm([m.nom, m.ref, nomMarque(m.marqueId), MT.categoryPath(m.categorieId, S.categories), ...variantesOf(m.id).flatMap((p) => [p.sku, p.ean, MT.variantLabel(p.attributs)])].join(" ")).includes(q)); }

}
function filtresBar() {

function reRefresh() { const e = $("#re"); if (e) e.innerHTML = reHTML(); }
function reCalc() { const r = { ...RE.r, lignes: RE.r.lignes.map((l) => ({ ...l, qte: num(l.qte) })), sorties: RE.r.sorties.map((s) => ({ ...s, qte: num(s.qte), partCout: num(s.partCout) })), mo: num(RE.r.mo), autres: num(RE.r.autres) }; const c = coutStd(r); const p = byId("produits", (r.sorties[0] || {}).produitId) || {};

<script>

function rj(itemId) {

  if (!STKC.m.has(itemId)) { const it = byId("stock", itemId) || {}; STKC.m.set(itemId, STK.rejouer(mvtsOf(itemId), { coutDefaut: it.coutDefaut, methode: it.methode || S.param.methodeStock })); }

}

/* Coût moyen pondéré glissant (remplace la moyenne de toutes les entrées historiques). */

reserve = function (id) { return LEGACY_reserve(id) + sum(S.ordres.filter((o) => o.statut === "en_cours"), (o) => sum((o.lignes || []).filter((l) => l.itemId === id), (l) => l.theo)); };

addMvt = async function (m) {

  for (const l of x.lignes || []) if (qteEmp(l.itemId, x.vers) < num(l.qte) - 1e-9) { toast(`Impossible : ${itemNom(l.itemId)} n'est plus entièrement à ${nomEmp(x.vers)}.`); return; }
  if (!confirmOnce("annTr" + id, "Clique encore pour confirmer l'annulation du transfert")) return;
  await guard(async () => { await put("transferts", id, { statut: "annule", annuleLe: today() }, "Transfert " + x.num + " annulé"); for (const m of S.mouvements.filter((m) => m.ref === "transferts/" + id && !m.annule)) await db.collection("mouvements").doc(m.id).update({ annule: true, annuleMotif: "transfert annulé" }); closeM(); }, "Transfert annulé");
}

function invView() {

  return `<p class="note">Un inventaire compte réellement le stock d'un emplacement, lot par lot. À la validation, chaque écart devient un mouvement « correction d'inventaire » valorisé au coût moyen, traçable et annulable.</p>` + (L.length ? `<div class="tw"><table><tr><th>N°</th><th>Date</th><th>Emplacement</th><th class="n">Lignes comptées</th><th class="n">Écart valorisé</th><th>Statut</th></tr>${L.map((x) => `<tr class="click ${x.statut === "annule" ? "off" : ""}" onclick="ouvrirInventaire('${x.id}')"><td><b>${esc(x.num)}</b></td><td>${dfr(x.date)}</td><td>${esc(nomEmp(x.emplacementId))}</td><td class="n">${(x.lignes || []).filter((l) => l.compte !== "" && l.compte !== null && l.compte !== undefined).length} / ${(x.lignes || []).length}</td><td class="n">${x.statut === "valide" ? F(x.valeurEcart) : "—"}</td><td>${{ brouillon: pill("st-attente", "En cours de comptage"), valide: pill("st-livree", "Validé"), annule: pill("st-annulee", "Annulé") }[x.statut]}</td></tr>`).join("")}</table></div>` : `<div class="empty">Aucun inventaire.</div>`);

function nouvelInventaire() {
  openM(`<h2>Nouvel inventaire · ${nextNum("inventaires", "INV")}</h2><div class="f"><label>Emplacement<select id="in_emp">${opt(EMPS().map((e) => [e.id, e.nom]), empDefaut())}</select></label><label>Types d'articles<select id="in_type">${optNone(TYPES_STOCK, "", "Tous")}</select></label><label>Date du comptage<input id="in_d" type="date" value="${today()}"></label></div>
  <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn light" onclick="closeM()">Annuler</button><button class="btn" onclick="creerInventaire()">Préparer la feuille de comptage</button></div>`);
}
async function creerInventaire() {
  const emp = v("in_emp"), ty = v("in_type"); const items = S.stock.filter((i) => !i.archive && (!ty || i.type === ty)); const lignes = [];
  items.forEach((i) => { const C = rj(i.id).couches.filter((c) => c.emp === emp && Math.abs(c.qte) > 1e-9); if (C.length) C.forEach((c) => lignes.push({ itemId: i.id, lot: c.lot, dlc: c.dlc || "", theorique: c.qte, compte: "" })); else lignes.push({ itemId: i.id, lot: "", dlc: "", theorique: 0, compte: "" }); });
  if (!lignes.length) { toast("Aucun article à compter"); return; }
  const numero = nextNum("inventaires", "INV");
  const id = await guard(async () => { const nid = await put("inventaires", null, { num: numero, date: v("in_d") || today(), emplacementId: emp, filtreType: ty, statut: "brouillon", lignes }, `Inventaire ${numero} préparé (${lignes.length} lignes)`); return nid; }, "Feuille de comptage prête");
  if (id) { await waitFor(() => byId("inventaires", id), 4000); ouvrirInventaire(id); }
}
function ouvrirInventaire(id) {
  const x = byId("inventaires", id); if (!x) return; const edit = x.statut === "brouillon";
  const L = STK.ecartsInventaire((x.lignes || []).map((l) => ({ ...l, theorique: edit ? invTheo(x, l) : l.theorique, cu: edit ? cu(l.itemId) : l.cu })));
  openM(`<div class="row"><h2 style="margin:0">Inventaire ${esc(x.num)}</h2>${{ brouillon: pill("st-attente", "En cours de comptage"), valide: pill("st-livree", "Validé"), annule: pill("st-annulee", "Annulé") }[x.statut]}<span class="sp"></span><button class="btn light sm" onclick="closeM()">Fermer</button></div><p class="muted">${dfr(x.date)} · ${esc(nomEmp(x.emplacementId))}${edit ? " · le théorique affiché est le stock actuel ; l'écart est calculé à la validation" : ""}</p>
  <div class="tw"><table class="vt"><tr><th>Article</th><th>Lot</th><th>Théorique</th><th>Compté</th><th>Écart</th><th class="n">Valeur de l'écart</th></tr>${L.map((l, k) => `<tr><td>${esc(itemNom(l.itemId))}</td><td>${esc(l.lot || "—")}${l.dlc ? `<div class="muted">DLC ${dfr(l.dlc)}</div>` : ""}</td><td>${N(l.theorique)} ${esc(itemU(l.itemId))}</td><td>${edit ? `<input type="number" step="any" min="0" data-inv="${k}" value="${esc(l.compte ?? "")}" placeholder="non compté" oninput="invCalc('${id}')">` : l.compte === null ? "—" : N(l.compte)}</td><td class="mg" id="inv_e${k}">${l.ecart === null ? "—" : (l.ecart > 0 ? "+" : "") + N(l.ecart)}</td><td class="n" id="inv_v${k}">${l.ecart ? F(l.valeur) : "—"}</td></tr>`).join("")}</table></div>
  <div class="calc" id="inv_tot" style="margin-top:10px"></div>
  <div class="row" style="margin-top:16px">${x.statut === "valide" ? `<button class="btn red sm" onclick="annulerInventaire('${id}')">Annuler l'inventaire</button>` : ""}${edit ? `<button class="btn light sm" onclick="abandonInventaire('${id}')">Abandonner</button>` : ""}<span class="sp"></span>${edit ? `<button class="btn light" onclick="saveInventaire('${id}',false)">Enregistrer le comptage</button><button class="btn" onclick="saveInventaire('${id}',true)">Valider l'inventaire</button>` : ""}</div>`, true); invCalc(id);
}
const invTheo = (x, l) => sum(rj(l.itemId).couches.filter((c) => c.emp === x.emplacementId && c.lot === (l.lot || "")), (c) => c.qte);
function invRead(x) { return (x.lignes || []).map((l, k) => { const e = document.querySelector(`[data-inv="${k}"]`); return { ...l, compte: e ? e.value : l.compte }; }); }
function invCalc(id) { const x = byId("inventaires", id); if (!x) return; const edit = x.statut === "brouillon"; const L = STK.ecartsInventaire(invRead(x).map((l) => ({ ...l, theorique: edit ? invTheo(x, l) : l.theorique, cu: edit ? cu(l.itemId) : l.cu })));
  L.forEach((l, k) => { const e = $("#inv_e" + k), vv = $("#inv_v" + k); if (e) e.innerHTML = l.ecart === null ? "—" : `<span style="color:${l.ecart < 0 ? "var(--red)" : l.ecart > 0 ? "var(--green)" : "inherit"}">${l.ecart > 0 ? "+" : ""}${N(l.ecart)}</span>`; if (vv) vv.textContent = l.ecart ? F(l.valeur) : "—"; });
  const c = L.filter((l) => l.compte !== null); const t = $("#inv_tot"); if (t) t.innerHTML = `${c.length} / ${L.length} ligne(s) comptée(s) · ${c.filter((l) => l.ecart).length} écart(s) · valeur nette des écarts <b>${F(sum(c, (l) => l.valeur))}</b> (manquants ${F(sum(c.filter((l) => l.valeur < 0), (l) => l.valeur))}, excédents ${F(sum(c.filter((l) => l.valeur > 0), (l) => l.valeur))})`; }
async function saveInventaire(id, valider) {
  const x = byId("inventaires", id); const lignes = invRead(x).map((l) => ({ ...l, compte: l.compte === "" || l.compte === null || l.compte === undefined ? "" : num(l.compte) }));
  if (lignes.some((l) => l.compte !== "" && l.compte < 0)) { toast("Quantité comptée négative"); return; }
  if (!valider) { await guard(async () => { await put("inventaires", id, { lignes }, ""); }, "Comptage enregistré"); return; }
  const C = lignes.filter((l) => l.compte !== ""); if (!C.length) { toast("Aucune ligne comptée"); return; }
  if (C.length < lignes.length && !confirmOnce("inv" + id, `${lignes.length - C.length} ligne(s) non comptée(s) seront laissées telles quelles. Clique encore sur « Valider » pour confirmer.`)) return;
  const fin = STK.ecartsInventaire(lignes.map((l) => ({ ...l, theorique: invTheo(x, l), cu: cu(l.itemId) })));
  await guard(async () => {
    for (const l of fin.filter((l) => l.ecart)) {
      const m = { date: x.date, itemId: l.itemId, type: "inventaire", qte: l.ecart, valeurUnitaire: l.cu, source: "inventaire", ref: "inventaires/" + id, motif: `Inventaire ${x.num}${l.lot ? " · lot " + l.lot : ""}`, emplacementId: x.emplacementId };
      if (l.ecart > 0) { if (l.lot) m.lot = l.lot; if (l.dlc) m.dlc = l.dlc; } else m.alloc = [{ lot: l.lot || "", qte: -l.ecart }];
      await addMvt(m);
    }
    await put("inventaires", id, { statut: "valide", valideLe: new Date().toISOString(), validePar: ME, lignes: fin.map(({ itemId, lot, dlc, theorique, compte, ecart, cu: c, valeur }) => ({ itemId, lot, dlc, theorique, compte: compte === null ? "" : compte, ecart, cu: c, valeur })), valeurEcart: sum(fin, (l) => l.valeur) }, `Inventaire ${x.num} validé · écart ${F(sum(fin, (l) => l.valeur))}`);
    closeM();
  }, "Inventaire validé : stocks corrigés");
}
async function annulerInventaire(id) { const x = byId("inventaires", id); if (!confirmOnce("annInv" + id, "Clique encore pour annuler l'inventaire et ses corrections")) return; await guard(async () => { await put("inventaires", id, { statut: "annule", annuleLe: today() }, "Inventaire " + x.num + " annulé"); for (const m of S.mouvements.filter((m) => m.ref === "inventaires/" + id && !m.annule)) await db.collection("mouvements").doc(m.id).update({ annule: true, annuleMotif: "inventaire annulé" }); closeM(); }, "Inventaire annulé, corrections retirées"); }
async function abandonInventaire(id) { const x = byId("inventaires", id); await guard(async () => { await put("inventaires", id, { statut: "annule", annuleLe: today() }, "Inventaire " + x.num + " abandonné"); closeM(); }, "Inventaire abandonné"); }

/* ================= EMPLACEMENTS & RÉGLAGES ================= */

  <p class="note">L'emplacement principal contient tout le stock enregistré avant cette version. Le stock d'une zone de quarantaine est compté dans le physique mais pas dans le disponible.</p></div>
  <div class="card">${SEC("Règles de sortie")}<div class="f"><label>Emplacement par défaut (ventes, achats, production)<select id="sc_def">${opt(E.map((e) => [e.id, e.nom]), empDefaut())}</select></label><label>Méthode de sortie des lots<select id="sc_met">${opt([["auto", "Automatique : FEFO si l'article a des dates limites, sinon FIFO"], ["fefo", "FEFO pour tous les articles"], ["fifo", "FIFO pour tous les articles"]], S.param.methodeStock || "auto")}</select></label></div><div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn" onclick="saveStockParams()">Enregistrer</button></div></div>`;

async function saveEmplacement(id) {
  const nom = v("em_nom").trim(); if (!nom) { toast("Nomme l'emplacement"); return; }
  if (EMPS().some((e) => e.id !== id && MT.norm(e.nom) === MT.norm(nom))) { toast("Un emplacement porte déjà ce nom"); return; }

async function archEmplacement(id) { const e = byId("emplacements", id); if (S.stock.some((i) => Math.abs(qteEmp(i.id, id)) > 1e-9)) { toast("Cet emplacement contient du stock"); return; } await guard(async () => { await put("emplacements", id, { archive: true }, "Emplacement archivé : " + e.nom); if (S.param.emplacementDefaut === id) await db.doc("parametres/general").set({ ...S.param, emplacementDefaut: PRINC }); closeM(); }, "Emplacement archivé"); }

{ const _rech = kItems; kItems = function (q) { const base = _rech(q); if (!q) return base; const ql = q.toLowerCase(); const extra = [...S.emplacements.map((e) => ({ t: e.nom, s: "Emplacement", f: () => { go("stocks"); SSUB = "emplacements"; setTimeout(render, 400); } })), ...S.inventaires.map((x) => ({ t: x.num, s: "Inventaire · " + nomEmp(x.emplacementId), f: () => ouvrirInventaire(x.id) })), ...S.transferts.map((x) => ({ t: x.num, s: "Transfert · " + nomEmp(x.de) + " → " + nomEmp(x.vers), f: () => voirTransfert(x.id) })), { t: "Nouvel inventaire", s: "Action", f: () => nouvelInventaire() }, { t: "Transfert de stock", s: "Action", f: () => editTransfertStock() }]; return [...base, ...extra.filter((o) => (o.t + " " + o.s).toLowerCase().includes(ql))].slice(0, 30); }; }

<script>
/* ============================================================
   MATEIÓN BUSINESS OS · Phase 4 — Finance & pilotage
   Indicateurs centralisés (FIN.indicateurs), compte de résultat,
   rentabilité par produit / marque / activité, budgets, prévisions,
   échéancier et factures fournisseurs, rapprochement bancaire,
   TVA et journal SYSCOHADA.
   ============================================================ */
const valeurSortie = (m) => { const x = rj(m.itemId).valeurs.get(m.id); return x ? x.valeur : Math.abs(num(m.qte)) * cu(m.itemId); };
const tauxTVA = (pid) => { const m = modeleOf(pid); const t = m && m.champs && m.champs.taxes; return t !== undefined && t !== "" ? num(t) : num(S.param.tauxTVA ?? 19.25); };
const FINH = { netV: MT.netV, cogsV: MT.cogsV, valeurSortie, tauxTVA, typeArticle: (id) => (byId("stock", id) || {}).type };
const finData = () => ({ ventes: S.ventes, depenses: S.depenses, achats: S.achats, operations: S.operations, mouvements: S.mouvements, lots: S.lots, comptes: S.comptes, tva: { assujetti: !!S.param.assujettiTVA, taux: num(S.param.tauxTVA ?? 19.25) } });
/* Toutes les vues (tableau de bord, rapports, finance) passent désormais par ce calcul unique. */
fin = function (r) {
  const x = FIN.indicateurs(finData(), r, FINH);
  return { ...x, res: x.resultat, sachets: x.unites, enc: x.encClients, encTotal: x.enc, tres: tresorerie(), stock: stockVal(), creances: sum(S.ventes, duV), dettes: sum(S.achats, duA) + sum(S.depenses, duD) };
};

let FSUB = "synthese";
function finance() {
  const tabs = [["synthese", "Synthèse"], ["resultat", "Compte de résultat"], ["rentabilite", "Rentabilité"], ["budgets", "Budgets"], ["previsions", "Prévisions"], ["echeancier", "Échéancier & factures"], ["rapprochement", "Rapprochement bancaire"], ["fiscal", "TVA & comptabilité"]];
  const sub = `<div class="ptabs">${tabs.map(([k, l]) => `<button class="${FSUB === k ? "on" : ""}" onclick="FSUB='${k}';render()">${l}</button>`).join("")}</div>`;
  const per = ["synthese", "resultat", "rentabilite", "budgets", "fiscal"].includes(FSUB) ? perBar() : "";
  const act = FSUB === "resultat" ? `<button class="btn light" onclick="exportResultat()">Excel</button>` : FSUB === "fiscal" ? `<button class="btn light" onclick="exportJournal()">Journal (Excel)</button>` : FSUB === "budgets" ? `<button class="btn" onclick="editBudget()">Saisir le budget ${BY}</button>` : "";
  return `<div class="row"><h2>Finance</h2><span class="sp"></span>${per}${act}</div>${sub}` + ({ synthese: finSynthese, resultat: finResultat, rentabilite: finRentabilite, budgets: finBudgets, previsions: finPrevisions, echeancier: finEcheancier, rapprochement: finRappro, fiscal: finFiscal }[FSUB] || finSynthese)();
}
const pct = (x) => (x === null || x === undefined || !isFinite(x) ? "—" : x.toFixed(1) + " %");

/* ---------- synthèse ---------- */
function finSynthese() {
  const r = range(PER.type, PER.ref), pr = prevRange(PER.type, PER.ref); const x = fin(r), y = pr ? fin(pr) : null; const d = (k) => (y ? delta(x[k], y[k]) : "");
  const V = ventesR(r); const encSurV = sum(V, (z) => encV(z)); const resteV = sum(V, duV);
  const bfr = x.stock + x.creances - x.dettes; const ech = FIN.anciennete(echeances().filter((e) => e.sens === "in"), today()); const echu = sum(ech.slice(1), (b) => b.montant);
  const B = buckets(r);
  return `<div class="kpis">${kpi("Chiffre d'affaires", F(x.ca), `${x.nbV} vente(s)${S.param.assujettiTVA ? " · HT " + F(x.caHT) : ""}`, "", d("ca"))}${kpi("Marge brute", F(x.mb), pct(x.tauxMB) + " du CA", x.mb < 0 ? "bad" : "", d("mb"))}${kpi("Résultat", F(x.resultat), pct(x.tauxResultat) + " du CA", x.resultat < 0 ? "bad" : "good", d("resultat"))}${kpi("Encaissé sur la période", F(x.encClients), "Paiements clients reçus", "", d("encClients"))}${kpi("Trésorerie", F(x.tres), "Solde de tous les comptes", x.tres < 0 ? "bad" : "")}${kpi("Besoin en fonds de roulement", F(bfr), "Stock + créances − dettes")}${kpi("Créances échues", F(echu), "Clients en retard de paiement", echu > 0 ? "warn" : "")}</div>
  <div class="card">${SEC("Ce que disent tes chiffres")}<ul class="integ">
   <li><b>Ventes :</b> ${F(x.ca)} vendus sur la période. Sur ces ventes, ${F(encSurV)} ont déjà été encaissés et <b>${F(resteV)}</b> restent à recevoir.</li>
   <li><b>Rentabilité :</b> après le coût des produits vendus (${F(x.cogs)}), il reste une marge brute de ${F(x.mb)}. Après les charges (${F(x.charges)})${x.pertesStock ? `, les pertes de stock (${F(x.pertesStock)})` : ""}${x.fraisFinanciers ? ` et les frais financiers (${F(x.fraisFinanciers)})` : ""}, le résultat est de <b>${F(x.resultat)}</b>.</li>
   <li><b>Argent :</b> ${F(x.encTotal)} sont entrés et ${F(x.dec)} sont sortis des comptes (flux net ${F(x.fluxNet)})${x.financement ? `, dont ${F(x.financement)} de financement (emprunts)` : ""}${x.capitaux ? ` et ${F(x.capitaux)} d'apports ou retraits du dirigeant` : ""}.${x.financement || x.capitaux ? " Ces mouvements de financement ne sont pas du résultat." : ""}</li>
   <li><b>Pourquoi le résultat diffère de la trésorerie :</b> une vente compte dans le chiffre d'affaires le jour où elle est faite, même si elle est payée plus tard ; un achat de stock sort de la trésorerie mais n'entre dans le résultat qu'au moment où le produit est vendu.</li></ul></div>
  <div class="card">${SEC("Chiffre d'affaires, résultat et encaissements")}${chart("line", B.map((b) => b.lab), [{ n: "Chiffre d'affaires", c: C1, v: B.map((b) => fin(b.r).ca) }, { n: "Résultat", c: C3, v: B.map((b) => fin(b.r).resultat) }, { n: "Encaissements clients", c: C2, v: B.map((b) => fin(b.r).encClients) }], { title: "Évolution" })}</div>`;
}

/* ---------- compte de résultat ---------- */
function lignesResultat(x) {
  const cats = Object.entries(x.parCategorie).sort((a, b) => b[1] - a[1]);
  return [["Chiffre d'affaires" + (S.param.assujettiTVA ? " HT" : ""), S.param.assujettiTVA ? x.caHT : x.ca, "t"], ["Coût des produits vendus", -x.cogs], ["Marge brute", (S.param.assujettiTVA ? x.caHT : x.ca) - x.cogs, "s"],
    ...cats.map(([c, m]) => ["  " + c, -m]), ["Charges d'exploitation", -x.charges, "s2"],

/* ---------- budgets ---------- */
let BY = new Date().getFullYear();
const postesBudget = () => [["ca", "Chiffre d'affaires", "produit"], ["achats", "Achats de stock", "charge"], ...CAT_DEP.map((c) => ["charge:" + c, c, "charge"])];
const budgetDoc = (y) => S.budgets.find((b) => num(b.annee) === num(y));
/* Montant budgété sur une période : mois couverts, au prorata des jours pour une semaine ou un jour. */
function budgetPeriode(b, poste, r) {
  if (!b || !b.lignes || !b.lignes[poste]) return 0; let t = 0;
  for (let m = 0; m < 12; m++) { const a = `${b.annee}-${String(m + 1).padStart(2, "0")}-01`; const z = new Date(num(b.annee), m + 1, 0).getDate(); const e = `${b.annee}-${String(m + 1).padStart(2, "0")}-${String(z).padStart(2, "0")}`;
    const s = a > r[0] ? a : r[0], f = e < r[1] ? e : r[1]; if (s > f) continue; const jours = (new Date(f + "T12:00:00") - new Date(s + "T12:00:00")) / 864e5 + 1; t += num(b.lignes[poste][m]) * jours / z; }
  return t;
}
function finBudgets() {
  const r = range(PER.type, PER.ref); const ys = [...new Set([r[0].slice(0, 4), r[1].slice(0, 4)])].filter((y) => y !== "0000" && y !== "9999");

  if (PER.type === "tout") return yearSel + `<div class="empty">Choisis une période (mois, trimestre, année…) pour comparer le budget au réel.</div>`;

  if (!docs.length) return yearSel + `<div class="hero"><div class="ey">Budget</div><div class="q">Fixe tes objectifs mois par mois.</div><div class="m">Saisis le chiffre d'affaires visé et les dépenses prévues par catégorie. MATEIÓN compare ensuite chaque période au réel : écart, taux de réalisation, postes en dépassement.</div><div class="row" style="margin-top:14px"><button class="btn inv" onclick="editBudget()">Saisir le budget ${BY}</button></div></div>`;
  const bud = (p) => sum(docs, (b) => budgetPeriode(b, p, r));

  <div class="tw"><table><tr><th>Poste</th><th class="n">Budget</th><th class="n">Réel</th><th class="n">Écart</th><th class="n">Réalisé</th><th style="width:180px"></th></tr>${L.map((l) => `<tr><td><b>${esc(l.l)}</b></td><td class="n">${F(l.budget)}</td><td class="n">${F(l.reel)}</td><td class="n" style="color:${l.favorable ? "var(--green)" : "var(--red)"}">${l.ecart > 0 ? "+" : ""}${F(l.ecart)}</td><td class="n">${pct(l.taux)}</td><td><div style="height:8px;border-radius:4px;background:var(--ln);overflow:hidden"><div style="height:100%;width:${Math.min(100, l.taux || 0)}%;background:${l.favorable ? "var(--green)" : "var(--red)"}"></div></div></td></tr>`).join("")}</table></div>

/* ---------- échéancier & factures fournisseurs ---------- */

  <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn light" onclick="closeM()">Fermer</button><button class="btn" onclick="rbValider()" ${ok.length ? "" : "disabled"}>Valider le rapprochement</button></div>`, true);

<script>
/* ============================================================
   MATEIÓN BUSINESS OS · Phase 5 — Commerce
   Devis → commande → bon de livraison → facture → avoir.
   Une facture validée crée une vente par ligne : chiffre d'affaires,
   coût des ventes, stocks, créances et finance restent calculés par
   les mécanismes existants (aucune logique dupliquée).
   Paiements au niveau de la facture, répartis sur ses lignes.
   Tarifs personnalisés, promotions, vente en gros, plafond de crédit.
   ============================================================ */
const TP = { devis: { pre: "DE", l: "Devis", pl: "Devis" }, commande: { pre: "BC", l: "Commande", pl: "Commandes" }, livraison: { pre: "BL", l: "Bon de livraison", pl: "Livraisons" }, facture: { pre: "FA", l: "Facture", pl: "Factures" }, avoir: { pre: "AV", l: "Avoir", pl: "Avoirs" } };
const piecesDe = (type) => S.pieces.filter((p) => p.type === type);
const lignesFacture = (fid) => S.ventes.filter((v) => v.factureId === fid && !v.avoir && v.statut !== "annulee").sort((a, b) => String(a.num).localeCompare(String(b.num), "fr", { numeric: true }));
const avoirsFin = (fid) => S.ventes.filter((v) => v.factureId === fid && v.avoir && v.statut !== "annulee");
const creditFacture = (fid) => paidOf("pieces/" + fid) + sum(avoirsFin(fid), (v) => Math.abs(num(v.total)));
function etatFacture(f) {
  const L = lignesFacture(f.id); const net = sum(L, netV); const regle = creditFacture(f.id); const reste = Math.max(0, net - regle);
  return { net, regle, reste, trop: Math.max(0, regle - net), statut: f.statut === "brouillon" ? "brouillon" : net <= 0.5 && L.length ? "soldee" : reste <= 0.5 ? "payee" : regle > 0.5 ? "partielle" : "nonpayee" };
}
const ST_FA = { brouillon: ["st-confection", "Brouillon"], payee: ["st-livree", "Payée"], soldee: ["st-livree", "Soldée par avoir"], partielle: ["st-attente", "Partiellement payée"], nonpayee: ["st-annulee", "Non payée"] };
const ST_DE = { brouillon: ["st-confection", "Brouillon"], envoye: ["st-attente", "Envoyé"], accepte: ["st-livree", "Accepté"], refuse: ["st-annulee", "Refusé"], expire: ["st-annulee", "Expiré"], annule: ["st-annulee", "Annulé"] };
const ST_BC = { confirmee: ["st-confection", "Confirmée"], partielle: ["st-attente", "Partiellement livrée"], livree: ["st-attente", "Livrée, à facturer"], terminee: ["st-livree", "Livrée et facturée"], annule: ["st-annulee", "Annulée"] };
const tvaOpts = () => ({ assujetti: !!S.param.assujettiTVA, tauxFn: (pid) => (typeof tauxTVA === "function" ? tauxTVA(pid) : 0) });
const totauxPiece = (p) => COM.totaux(p.lignes || [], p.remiseGlobale, tvaOpts());

/* Paiements d'une facture répartis sur ses lignes (et avoirs financiers déduits) : toutes les créances restent justes. */
encV = function (x) {
  let e = paidOf("ventes/" + x.id);
  if (x.factureId && !x.avoir) { const L = lignesFacture(x.factureId); const i = L.findIndex((v) => v.id === x.id); if (i >= 0) e += COM.repartir(creditFacture(x.factureId), L.map(netV))[i] || 0; }
  return e;
};
/* Une ligne de facture se gère depuis sa facture (modification, retour, annulation passent par la facture et l'avoir). */
const LEGACY_voirVente = voirVente;
voirVente = function (id) { const x = byId("ventes", id); if (x && x.factureId && byId("pieces", x.factureId)) return voirPiece(x.factureId); return LEGACY_voirVente(id); };
/* Échéances : une ligne par facture (et non par ligne de facture). */
const LEGACY_echeances = echeances;
echeances = function () {
  const all = S.ventes; let L; S.ventes = all.filter((v) => !v.factureId); try { L = LEGACY_echeances(); } finally { S.ventes = all; }
  const t = today(), s7 = addDays(t, 7);
  piecesDe("facture").filter((f) => f.statut === "validee").forEach((f) => { const e = etatFacture(f); if (e.reste > 0.5) L.push({ sens: "in", qui: nomCli(f.clientId), doc: f.num, ini: e.net, paye: e.regle, du: e.reste, ech: f.echeance, etat: !f.echeance ? "" : f.echeance < t ? "retard" : f.echeance <= s7 ? "proche" : "avenir", open: `voirPiece('${f.id}')` }); });
  return L.sort((a, b) => String(a.ech || "9").localeCompare(String(b.ech || "9")));
};
/* Réservé : quantités commandées pas encore livrées. */
const LEGACY_reserve2 = reserve;
reserve = function (id) { const it = byId("stock", id); let r = LEGACY_reserve2(id); if (!it || !it.produitId) return r;
  piecesDe("commande").filter((c) => c.statut !== "annule").forEach((c) => COM.suivi(c, S.pieces).forEach((s) => { if (s.produitId === it.produitId) r += s.resteALivrer; })); return r; };
/* Canaux de vente supplémentaires (boutique en ligne, point de vente, application, API partenaires…). */
function syncCanaux() { String(S.param.canauxSupp || "").split(",").map((x) => x.trim()).filter(Boolean).forEach((c) => { if (!CANAUX.includes(c)) CANAUX.splice(CANAUX.length - 1, 0, c); }); }
{ const _r = render; render = function (...a) { try { syncCanaux(); } catch (e) {} return _r(...a); }; }

/* ---------- prix ---------- */
function reglesPrix() { const prep = (o) => ({ ...o, descendants: String(o.cible || "").startsWith("categorie:") ? MT.descendants(o.cible.slice(10), S.categories) : [] });
  return { tarifs: S.tarifs.map((t) => ({ ...t, regles: (t.regles || []).map(prep) })), promos: S.promotions.map(prep) }; }
function prixPour(pid, ctx) { const p = byId("produits", pid); if (!p) return { pu: 0, source: "" }; const R = reglesPrix(); return COM.prixApplicable(p, { ...ctx, client: byId("clients", ctx.clientId) || { type: ctx.typeClient } }, R.tarifs, R.promos, modeleOf(pid)); }
const encoursClient = (cid) => sum(S.ventes.filter((v) => v.clientId === cid), duV);

/* ================= ÉCRAN COMMERCE ================= */
let CSUB = "bord", CF = { q: "", statut: "" };
function commerce() {
  const tabs = [["bord", "Vue d'ensemble"], ["devis", "Devis"], ["commande", "Commandes"], ["livraison", "Livraisons"], ["facture", "Factures"], ["avoir", "Avoirs"], ["tarifs", "Tarifs, promotions & canaux"]];
  const sub = `<div class="ptabs">${tabs.map(([k, l]) => `<button class="${CSUB === k ? "on" : ""}" onclick="CSUB='${k}';CF.statut='';render()">${l}</button>`).join("")}</div>`;
  const act = CSUB === "tarifs" ? `<button class="btn light" onclick="editPromo()">+ Promotion</button><button class="btn" onclick="editTarif()">+ Tarif</button>` : `<button class="btn light" onclick="editPiece('devis')">+ Devis</button><button class="btn light" onclick="editPiece('commande')">+ Commande</button><button class="btn" onclick="editPiece('facture')">+ Facture</button>`;
  return `<div class="row"><h2>Commerce</h2><span class="sp"></span>${CSUB === "bord" ? perBar() : ""}${act}</div>${sub}` + (CSUB === "bord" ? comBord() : CSUB === "tarifs" ? tarifsView() : listePieces(CSUB));
}
function comBord() {
  const r = range(PER.type, PER.ref), t = today();
  const dv = piecesDe("devis").filter((d) => ["brouillon", "envoye"].includes(COM.statutDevis(d, t)));
  const cmd = piecesDe("commande").filter((c) => !["annule", "terminee"].includes(COM.statutCommande(c, S.pieces)));
  const aLivrer = sum(cmd, (c) => sum(COM.suivi(c, S.pieces), (s) => { const l = c.lignes.find((x) => x.ligneId === s.ligneId); return s.resteALivrer * num(l.pu) * (1 - num(l.remisePct) / 100); }));
  const aFact = sum(cmd, (c) => sum(COM.suivi(c, S.pieces), (s) => { const l = c.lignes.find((x) => x.ligneId === s.ligneId); return s.resteAFacturer * num(l.pu) * (1 - num(l.remisePct) / 100); }));
  const FA = piecesDe("facture").filter((f) => f.statut === "validee"); const FAp = FA.filter((f) => inR(f.date, r));
  const imp = FA.map((f) => ({ f, e: etatFacture(f) })).filter((x) => x.e.reste > 0.5); const ret = imp.filter((x) => x.f.echeance && x.f.echeance < t);

/* Facturer une commande : ce qui a été livré par bon de livraison est facturé sans nouvelle sortie de stock ; le reste est livré avec la facture. */
function facturerCommande(id) {
